 { id: '10.2', title: 'Obligātās militārās operācijas', sim: 'milops',
   rule: `<p>Katrā gājienā katram spēlētājam jāveic noteikts skaits <b>militāro operāciju</b> ${E('Required Military Operations')}. Vajadzīgais skaits ir vienāds ar <b>pašreizējo DEFCON</b>.</p>
   <ul><li>Pārbauda gājiena beigās, fāzē <b>Check Military Operations Status</b> (pēc visām Action kārtām). Skaitās DEFCON, kāds ir šajā brīdī.</li>
   <li>Par katru <b>trūkstošo</b> militāro operāciju <b>pretinieks</b> saņem <b>1 VP</b>.</li>
   <li>Ja sodu saņem abi, uz VP trases atzīmē tikai <b>starpību</b>.</li>
   <li>Pēc pārbaudes abus marķierus atliek uz <b>0</b>.</li></ul>
   <p><b>Kas pārvieto militāro operāciju marķieri:</b></p>
   <div class="tblw"><table class="cmp"><tr><th>Darbība</th><th>Skaitās?</th><th>Par cik</th></tr>
   <tr><td>Apvērsums ar operācijas punktiem</td><td>jā</td><td>par kārts operācijas vērtību</td></tr>
   <tr><td>Kara notikums</td><td>jā</td><td>par skaitli, kas rakstīts kārtī</td></tr>
   <tr><td>Pārorientācija</td><td>nē</td><td>—</td></tr>
   <tr><td>Bezmaksas apvērsums no notikuma</td><td>nē</td><td>—</td></tr></table></div>
   <p>Marķieris nevar būt augstāk par <b>5</b>.</p>
   <p>Ja tu izspēlē kārti <b>operācijas punktiem</b> un tā izraisa <b>pretinieka</b> kara notikumu, savu marķieri pārvieto <b>pretinieks</b>, kā raksta kārtī.</p>`,
   example: `<p><b>Noteikumu grāmatas piemērs.</b> DEFCON ir <b>4</b>. ASV gājienā veikusi <b>2</b> militārās operācijas. Trūkst 2, tāpēc PSRS saņem <b>2 VP</b>.</p>
   <p><b>Oficiālais piemērs (BB 5. lpp.).</b> 1. gājiena beigās DEFCON ir <b>2</b>, tātad vajag 2. PSRS ir 5, ASV ir 5. Abiem pietiek, neviens VP nesaņem. Gājiena sākumā DEFCON bija 5, bet skaitās DEFCON gājiena beigās.</p>`,
   important: `<ul><li>Vajadzīgo skaitu nosaka DEFCON pārbaudes brīdī, nevis gājiena sākumā.</li>
   <li>VP saņem <b>pretinieks</b> tam, kuram trūkst militāro operāciju.</li>
   <li>Ja kārts operācijas vērtību maina notikums, skaitās mainītā vērtība. Oficiālajā piemērā (BB 5. lpp.) ASV kārtij Duck and Cover ar Red Scare/Purge ir 2 operācijas punkti, nevis 3. ASV apvērsums dod ASV militārās operācijas <b>2</b>.</li>
   <li>Pārorientācija un bezmaksas apvērsums marķieri nepārvieto, arī ja tos dara daudz.</li></ul>`,
   src: 'RB 4.5 E (9. lpp.), 6.3.3 (12. lpp.), 7.4.2 (14. lpp.), 8.2.1–8.2.4 un piemēri (15. lpp.), BB 5. lpp.',
   real: [IMG('bb_endturn1.jpg','Oficiālā piemēra 1. gājiena beigas: DEFCON 2, vajag 2','BB 5. lpp.'), IMG(MIL_IMG,'Militāro operāciju trase 0–5','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG(DEF_IMG,'DEFCON trase: tās skaitlis ir vajadzīgais militāro operāciju skaits','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')],
   extra: [`<p><b>Abi saņem sodu.</b> DEFCON ir 4. ASV ir 2 militārās operācijas (trūkst 2, PSRS +2 VP). PSRS ir 3 (trūkst 1, ASV +1 VP). Uz VP trases atzīmē tikai starpību: <b>PSRS +1 VP</b>.</p>`,
           `<p><b>Noteikumu grāmatas piemērs.</b> ASV izspēlē <b>Arab-Israeli War</b> (PSRS kārts) operācijas punktiem Action fāzē. Tāpēc PSRS kara notikums notiek, un <b>PSRS</b> pārvieto savu militāro operāciju marķieri par <b>2</b>.</p>`] },

 { id: '10.3', title: 'Kara notikumi', sim: 'warevent',
   rule: `<p>Kavā ir <b>5 kara notikumi</b> ${E('War Events')}: Korean War, Arab-Israeli War, Indo-Pakistani War, Brush War un Iran-Iraq War.</p>
   <ul><li>Lai izspēlētu kara notikumu, <b>nav vajadzīga ietekme</b> ne valstī, kas uzbrūk, ne valstī, kurai uzbrūk.</li>
   <li>Kara notikums skaitās <b>militārā operācija</b>. Marķieri pārvieto par skaitli, kas rakstīts <b>kārtī</b>.</li>
   <li>Arī ja mērķī nav ietekmes, ko zaudēt, spēlētājs saņem militārās operācijas un, ja uzvar, VP.</li></ul>
   <p><b>Indo-Pakistani War</b> (abu pušu kārts, 2 operācijas punkti) soli pa solim:</p>
   <ol><li>Spēlētājs izvēlas: Indija uzbrūk Pakistānai vai Pakistāna Indijai. <b>Mērķis</b> ir valsts, kurai uzbrūk.</li>
   <li>Met kauliņu. Atņem <b>1</b> par katru <b>pretinieka kontrolētu</b> valsti, kas ir <b>blakus mērķim</b>.</li>
   <li>Ja rezultāts ir <b>4–6</b>, tā ir uzvara.</li>
   <li>Militāro operāciju marķieri pārvieto par <b>2</b>. Tas notiek vienmēr, arī bez uzvaras.</li>
   <li>Uzvaras gadījumā: <b>+2 VP</b>, un visu pretinieka ietekmi mērķa valstī aizstāj ar savu. Tas ir: noņem visus pretinieka marķierus un pieliek tikpat daudz savu.</li></ol>`,
   example: `<p><b>Oficiālais piemērs (BB 8. lpp.).</b> PSRS Action kārtā PSRS izspēlē <b>Indo-Pakistani War</b> kā notikumu. Mērķis: <b>Pakistāna</b>. Blakus Pakistānai ir Irāna, ko kontrolē ASV: atņem 1. PSRS met <b>3</b>: 3 − 1 = <b>2</b>. Tas nav 4–6, tāpēc karš neizdodas, ietekme nemainās. PSRS militārās operācijas: <b>2</b>.</p>`,
   important: `<ul><li>Modifikators ir tikai par <b>pretinieka kontrolētām</b> kaimiņvalstīm. Pretinieka ietekme bez kontroles neko neatņem.</li>
   <li>Indo-Pakistani War aprēķinā neizmanto stabilitāti un nepieskaita operācijas punktus. Skaitās tikai metiens un modifikators.</li>
   <li>Militārās operācijas no kara notikuma saņem arī tad, ja karš neizdodas.</li>
   <li>Katra kara notikuma mērķi, uzvaras metienu, VP un militārās operācijas raksta kārtī. Spēlē to izlasi uz kārts.</li>
   <li>Militāro operāciju marķieris nevar būt augstāk par 5.</li></ul>`,
   src: 'RB 7.6 (14. lpp.), 8.2.2–8.2.4 (15. lpp.), Indo-Pakistani War kārts (RB 14. lpp.), BB 4., 8. lpp.',
   real: [IMG('card_indopak.jpg','Indo-Pakistani War kārts','RB 14. lpp.'), IMG('bb_indopak.jpg','Oficiālais piemērs: Indo-Pakistani War, mērķis Pakistāna','BB 8. lpp.'), IMG('bb_arabisraeli.jpg','Oficiālais piemērs: Arab-Israeli War neizdodas, PSRS militārās operācijas 5','BB 4. lpp.')],
   extra: [`<p><b>Oficiālais piemērs (BB 4. lpp.).</b> PSRS Action kārtā PSRS izspēlē <b>Arab-Israeli War</b> kā notikumu. Modifikatoru nav. Metiens 3: karš neizdodas, ietekme nemainās. PSRS militārās operācijas bija 3 (no apvērsuma Irānā), tagad <b>5</b>.</p>`,
           `<p><b>Uzvaras piemērs.</b> ASV Action kārtā ASV izspēlē Indo-Pakistani War kā notikumu. Mērķis: <b>Indija</b>, kur ir PSRS 2. PSRS nekontrolē nevienu valsti blakus Indijai (Pakistāna, Birma). ASV met <b>5</b>: uzvara. Indijā noņem 2 PSRS marķierus un pieliek 2 ASV. ASV saņem <b>2 VP</b> un 2 militārās operācijas.</p>`] },
 ]}
);

{ id: 12, title: 'Vērtēšana un uzvara', topics: [
 { id: '12.1', title: 'Reģiona vērtēšana', sim: 'scorelevel',
   rule: `<p>Katram reģionam ir sava <b>vērtēšanas kārts</b> (Scoring). Kad to izspēlē, <b>abi</b> spēlētāji saņem VP par to, cik valstu reģionā kontrolē. Katrs saņem VP par <b>vienu</b> līmeni:</p>

 { id: '12.2', title: 'Papildu VP', sim: 'scorecalc',

 { id: '12.3', title: 'VP trase', sim: 'vptrack',

 { id: '12.4', title: 'Uzvara', sim: 'whowins',
   rule: `<p><b>Automātiska uzvara.</b> Spēle beidzas uzreiz, ja:</p>

for (const id of [11,12]) { const i = FUTURE.findIndex(f => f[0] === id); if (i >= 0) FUTURE.splice(i, 1); }

const LVS = {control:'Kontrole', domination:'Dominēšana', presence:'Klātbūtne', null:'Nekas (0 VP par līmeni)'};
const RSCN = {
 rbCA:  {reg:'CA', inf:{'Guatemala':[1,0],'Cuba':[0,3],'Haiti':[0,1],'Dominican Rep.':[1,2],'Panama':[1,0]}, s:'RB 10.1 piemērs (16. lpp.)', who:'USSR'},

 meDom: {reg:'ME', inf:{'Egypt':[0,2],'Iraq':[0,3],'Syria':[0,2],'Israel':[4,0]}},
 meNoN: {reg:'ME', inf:{'Egypt':[0,2],'Iraq':[0,3],'Libya':[0,2],'Israel':[4,0]}},
 saCtl: {reg:'SA', inf:{'Chile':[3,0],'Argentina':[2,0],'Venezuela':[2,0],'Brazil':[2,0],'Peru':[0,2]}},
 saDom: {reg:'SA', inf:{'Venezuela':[0,2],'Colombia':[0,1],'Chile':[0,3],'Brazil':[2,0]}},

 afDom: {reg:'AF', inf:{'South Africa':[3,0],'Nigeria':[1,0],'Kenya':[2,0],'Zaire':[0,1],'Botswana':[0,2]}},
 caAdj: {reg:'CA', inf:{'Mexico':[0,2],'Cuba':[0,3],'Panama':[2,0],'Costa Rica':[3,0],'Honduras':[2,0]}},
 euPres:{reg:'EU', inf:{'W. Germany':[4,0],'Italy':[2,0],'E. Germany':[0,3],'Poland':[0,3]}},
 euCtl: {reg:'EU', inf:{'France':[0,3],'Italy':[0,2],'W. Germany':[0,4],'E. Germany':[0,3],'Poland':[0,3],'UK':[5,0]}},
 asNone:{reg:'AS', inf:{'India':[0,3],'Pakistan':[0,2],'Japan':[2,0]}},
 asJap: {reg:'AS', inf:{'Japan':[0,4],'North Korea':[0,3],'South Korea':[3,0],'Taiwan':[3,0],'Australia':[4,0]}},
 asAfg: {reg:'AS', inf:{'Afghanistan':[2,0],'Pakistan':[2,0],'India':[0,3],'Burma':[0,2]}},
};
const lvWhy = (reg, inf, side) => { const a=regionStat(reg,inf,side), b=regionStat(reg,inf,OTHER(side)), L=SUPLV[side], O=SUPLV[OTHER(side)];
  if(!a.ctl.length) return `${L} nekontrolē nevienu valsti: nav pat Klātbūtnes.`;
  const more=a.ctl.length>b.ctl.length, allbg=a.bg.length===a.bgAll.length, morebg=a.bg.length>b.bg.length, non=a.nonbg.length>=1;
  return `${L} kontrolē ${a.ctl.length} ${a.ctl.length===1?'valsti':'valstis'} (${O}: ${b.ctl.length}), Battleground ${a.bg.length} no ${a.bgAll.length} (${O}: ${b.bg.length}), valstis, kas nav Battleground: ${a.nonbg.length}. `+
   (more&&allbg?'Vairāk valstu un visas Battleground valstis: <b>Kontrole</b>.' : more&&morebg&&non?'Vairāk valstu, vairāk Battleground un ir valsts, kas nav Battleground: <b>Dominēšana</b>.' :
    `<b>Klātbūtne</b>, jo ${!more?'nav vairāk valstu nekā pretiniekam':!morebg?'nav vairāk Battleground valstu nekā pretiniekam':'nav nevienas valsts, kas nav Battleground'}${more&&!allbg?'; Kontrolei trūkst Battleground valstu':''}.`); };
const ptsWhy = (reg, inf, side) => { const r=scoreSide(reg,inf,side), L=SUPLV[side];
  if(!r.lv) return `${L}: 0 VP (nekontrolē nevienu valsti).`;
  return `${L}: ${LVS[r.lv]} ${r.base} + Battleground ${r.bg}${r.st.bg.length?` (${r.st.bg.map(nmPlain).join(', ')})`:''} + blakus pretinieka lielvarai ${r.adj}${r.st.adj.length?` (${r.st.adj.map(nmPlain).join(', ')})`:''} = <b>${r.vp} VP</b>.`; };
const lvQ = (k, side, extra={}) => { const S=RSCN[k], lv=regionLevel(S.reg,S.inf,side), all=['control','domination','presence',null];
  return {q:`${scHead(S.reg,S.who)} Kāds līmenis ir <b>${SUPLV[side]}</b>?`, v:scVis(S.reg,S.inf), o:[lv,...all.filter(x=>x!==lv)].map(x=>LVS[x]), e:lvWhy(S.reg,S.inf,side), s:S.s||'RB 10.1.1 (16. lpp.), karte', ...extra}; };
const vpQ = (k, side) => { const S=RSCN[k], r=scoreSide(S.reg,S.inf,side);
  return {type:'num', q:`${scHead(S.reg,S.who)} Cik VP saņem <b>${SUPLV[side]}</b>? (Pirms starpības aprēķina.)`, v:scVis(S.reg,S.inf), n:r.vp, min:0, max:20, unit:'VP', e:ptsWhy(S.reg,S.inf,side), s:S.s||'RB 10.1.1–10.1.2 (16. lpp.), karte'}; };
const netTxt = r => r.to?`${SUPLV[r.to]} +${r.net}`:'Neviens (0)';
const netQ = (k) => { const S=RSCN[k], r=scoreRegion(S.reg,S.inf), ok=netTxt(r);

   extra: [`<p><b>Olympic Games</b>: pelēka zvaigzne ar 2, EARLY WAR, aiz nosaukuma zvaigznītes nav, apakšā ☢. Abu pušu notikums, 2 operācijas punkti. Pēc notikuma kārts iet uz Discard kavu.</p>`,
     `<p><b>Central America Scoring</b>: pelēka zvaigzne bez skaitļa, MID WAR, sarkanā joslā "MAY NOT BE HELD", vērtēšanas tabula (Presence 1, Domination 3, Control 5). Tā ir vērtēšanas kārts.</p>`],
   important: `<ul><li>Neko no tā nav jāatceras: kārts ir tavā rokā, un viss ir uzdrukāts.</li>
   <li>Zvaigznes krāsa ir pirmā lieta, uz ko skatīties. No tās atkarīgs, vai vari izspēlēt notikumu.</li>
   <li>Zvaigznīte (*) nozīmē Trash kavu tikai tad, ja notikums <b>notika</b>.</li></ul>`,
   src: 'RB 2.2.1–2.2.6 (5. lpp.), kārts paraugs (RB 5. lpp.), kāršu attēli RB',

 { id: '14.2', title: 'Izlasi kārts tekstu', sim: 'cardtext',
   rule: `<p>Kad notikums notiek, tu dari <b>tieši to, kas rakstīts</b> uz kārts. Lasi lēnām un meklē:</p>
   <ul><li><b>Kurš</b> to dara? ("US player", "USSR player", "Player" = tas, kurš izspēlē, "Opponent" = pretinieks.)</li>
   <li><b>Ko</b> dara? (pievieno / noņem ietekmi, met kauliņu, saņem VP, maina DEFCON.)</li>
   <li><b>Kur?</b> (reģions, "Eastern Europe", "Western Europe", Battleground valstis, "uncontrolled" = nekontrolēta.)</li>
   <li><b>Cik?</b> (skaitļi tekstā ir treknrakstā, piemēram "add <b>5</b>", "no more than <b>2</b> per country".)</li>
   <li><b>Nosacījums?</b> ("If the US is ahead on the Space Race track…" Ja nosacījums nav izpildīts, nekas nenotiek.)</li></ul>
   <p>Ja notikums liek likt ietekmi, kaimiņu noteikums neattiecas. Ietekmi liek tur, kur saka kārts.</p>
   <p>Ja notikums izmaina operāciju vērtību (piemēram Red Scare/Purge), tas attiecas uz <b>visu</b>, kam lieto šīs kārtis: ietekmi, apvērsumu, militārās operācijas.</p>`,
   example: `<p><b>Oficiālais piemērs (BB 4. lpp.).</b> ASV izspēlē Truman Doctrine: "Removes all USSR Influence from one uncontrolled European country." Rumānijā ir 1 PSRS ietekme, stabilitāte 3, tātad Rumāniju neviens nekontrolē. ASV izvēlas Rumāniju: PSRS ietekme noņemta, Rumānija 0/0.</p>`,
   extra: [`<p><b>COMECON (BB 5. lpp.).</b> "Add 1 Influence to four Eastern European countries." PSRS izvēlas Austrumvāciju, Čehoslovākiju, Ungāriju un Somiju. Katrā +1. Somija ir arī Austrumeiropā (abos Eiropas apakšreģionos).</p>`,
     `<p><b>Red Scare/Purge (noteikumu grāmatas piemērs).</b> PSRS to izspēlēja. ASV veic apvērsumu ar 2 punktu kārti. ASV pieskaita metienam tikai 1 un saņem tikai 1 militāro operāciju.</p>`],
   important: `<ul><li>Kārts teksts ir uz kārts. Tev tas nav jāzina no galvas, tikai jāizlasa.</li>
   <li>"Player" ir tas, kurš kārti izspēlē. Ja tu izspēlē pretinieka kārti, notikumu izpilda <b>pretinieks</b>, it kā viņš būtu to izspēlējis.</li>
   <li>Ja nosacījums nav izpildīts vai notikums ir aizliegts, notikums nenotiek, un kārts ar zvaigznīti iet uz Discard kavu, nevis Trash kavu.</li></ul>`,
   src: 'RB 5.2, 7.1–7.5 (10.–14. lpp.), kāršu attēli RB, BB 4.–5. lpp.',
   real: [IMG('card_quagmire.jpg','Quagmire*: garš teksts ar nosacījumiem','RB 10. lpp.'), IMG('card_indopak.jpg','Indo-Pakistani War: kara kārts','RB 15. lpp.'), IMG('card_alliance.jpg','Alliance for Progress*: VP par kontrolētām valstīm','RB 10. lpp.')] },

 { id: '14.3', title: 'Kā izspēlēt jebkuru kārti', sim: 'cardflow',
   rule: `<p>Katrā Action kārtā tu izspēlē vienu kārti. Ar <b>jebkuru</b> kārti rīkojies pēc šiem 5 soļiem:</p>${FLOW_HTML}
   <p><b>Īpaši gadījumi:</b></p>
   <ul><li><b>Kosmosa sacīkstes:</b> ja kārti izspēlē kosmosa sacīkstēm, notikums <b>nenotiek</b> (arī pretinieka), un kārts iet uz Discard kavu.</li>
   <li><b>Vērtēšanas kārtis:</b> tās izspēlē tikai kā notikumu (vērtēšanu). Tās nedrīkst paturēt rokā gājiena beigās. Pēc izspēles tās iet uz Discard kavu. Tikai Southeast Asia Scoring ir ar zvaigznīti, to izņem no spēles.</li>
   <li><b>Virsraksta fāze:</b> virsraksta kārtij vienmēr notiek <b>notikums</b>, pat ja tas palīdz pretiniekam.</li>
   <li>Ja notikums ir atcelts vai aizliegts ar citu kārti, kārti joprojām drīkst izspēlēt operācijas punktiem.</li></ul>`,
   example: `<p><b>Noteikumu grāmatas piemērs.</b> ASV izspēlē Arab-Israeli War (PSRS kara notikums) 2 operācijas punktiem. Notikums ir aizliegts ar Camp David Accords. ASV saņem 2 operācijas punktus, bet notikums nenotiek.</p>
   <p><b>Noteikumu grāmatas piemērs.</b> PSRS izspēlē Star Wars operācijām. ASV nav priekšā kosmosa sacīkstēs. Nekas nenotiek, kārts iet uz Discard kavu.</p>`,
   extra: [`<p><b>Noteikumu grāmatas piemērs.</b> PSRS izspēlē Alliance for Progress. ASV nekontrolē nevienu Battleground valsti Centrālamerikā vai Dienvidamerikā. Notikums tomēr skaitās izspēlēts, un kārti izņem no spēles (Trash kava).</p>`,
     `<p><b>BB 4. lpp.</b> PSRS izspēlē Suez Crisis (PSRS kārts) kā <b>3 operācijas punktus</b> un liek ietekmi. Tā ir PSRS pašas kārts, tāpēc notikums nenotiek. Kārts iet uz Discard kavu.</p>`],
   important: `<ul><li>Pretinieka kārti tu nedrīksti izspēlēt kā notikumu. Bet ja izspēlē to operācijām, pretinieka notikums notiek.</li>
   <li>Pretinieka notikumu izpilda pretinieks, it kā viņš būtu kārti izspēlējis.</li>
   <li>Tu (Phasing Player) izvēlies, vai pretinieka notikums notiek pirms vai pēc tavām operācijām.</li>
   <li>Notikums bez efekta tomēr skaitās noticis. Kārts ar zvaigznīti iet uz Trash kavu.</li></ul>`,
   src: 'RB 4.5 C (8. lpp.), 5.1–5.3 (10. lpp.), 6.4.5 (13. lpp.), 7.1–7.5 (14. lpp.), 10.3.1 (17. lpp.), BB 4. lpp.',
   real: [IMG('card_anatomy.jpg','Uz ko skatīties: zvaigzne, skaitlis, *, teksts','RB 5. lpp.'), IMG('card_starwars.jpg','Star Wars*: RB 5.2 piemērs','RB 10. lpp.'), IMG('card_alliance.jpg','Alliance for Progress*: RB 5.2 piemērs','RB 10. lpp.'), IMG('seq_play.jpg','Gājiena secība: F. Check for Held Scoring Card','RB 7. lpp.')] },

  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(MAPW,x1+pad);y1=Math.min(MAPH,y1+pad);
  let w=x1-x0,hh=y1-y0; if(w/hh<1.3){ const nw=hh*1.3; x0=Math.max(0,x0-(nw-w)/2); w=Math.min(nw,MAPW-x0);} return [x0,y0,w,hh];
}

const CSTEM = Object.keys(C).map(n=>{ const lv=LV[n]||n; return [n, new RegExp('(^|[^\\p{L}])('+(lv.length>5?lv.slice(0,-1):lv).replace(/[.*+?^${}()|[\]\\/]/gu,'\\$&')+'\\p{L}{0,3}|'+n.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&')+')(?![\\p{L}])','u')]; });
function autoBoxes(q){ if(q.view||q.type==='place'||(q.v&&(q.v.map||q.v.cards||q.v.dice||q.v.boxes||q.v.box||typeof q.v==='string'))) return q; const t=q.q.replace(/<[^>]+>/g,'').replace(/Vietnam Revolts|Indo-Pakistani War|Arab-Israeli War|Iran-Iraq War|Korean War|US\/Japan Mutual Defense Pact/g,'');
  const hit=CSTEM.filter(([n,re])=>re.test(t)).map(x=>x[0]).slice(0,4);

function autoVis(q){ const t=q.q.replace(/<[^>]+>/g,''), v={...(q.v||{})}; if(typeof q.v==='string') return q;
  const have=[...(v.img?[v.img]:[]),...(v.imgs||[])]; const cardHas=n=>(v.cards||[]).some(c=>c[0].includes(n)); const add=[...new Set(AUTOVIS.filter(([re,f])=>re.test(t)&&!have.includes(f)&&!(f==='vp_track.jpg'&&(/kosmos|Space Race/i.test(t)||v.html))&&!(f==='card_china.jpg'&&cardHas('China'))&&!(f==='card_cascoring.jpg'&&(cardHas('Scoring')||/(Europe|Asia|Middle East|South America|Africa) Scoring/.test(t)))).map(x=>x[1]))];
  let html=v.html; if(!html&&/Presence|Domination|Klātbūtn|Dominēšan|vērtēšanas kārti [A-Z]|Scoring\b/.test(t)&&!/Southeast Asia Scoring|Held Scoring|Final Scoring/.test(t)) html=RTABS();
  if(!add.length&&html===v.html) return q;

const LSK='ts-academy-progress-v1';
let P = {v:1, done:{}, seen:{}, last:null, updated:0};
let DBDOC=null, saving=Promise.resolve(), cloud='local';
function mergeP(a,b){ // never lose a pass
  const o={v:1,done:{},seen:{},last:null,updated:Math.max(a.updated||0,b.updated||0)};
  for(const src of [a,b]){ for(const k in (src.done||{})){ const x=src.done[k], y=o.done[k]||{best:0,att:0,ok:false}; o.done[k]={best:Math.max(y.best,x.best||0),att:Math.max(y.att,x.att||0),ok:y.ok||!!x.ok}; }
    for(const k in (src.seen||{})) o.seen[k]=Math.max(o.seen[k]||0,src.seen[k]); }
  o.last=(a.updated||0)>=(b.updated||0)?(a.last||b.last):(b.last||a.last); return o; }
function loadLocal(){ try{ const s=localStorage.getItem(LSK); if(s) P=mergeP(P,JSON.parse(s)); }catch(e){} }
function save(){ P.updated=Date.now(); try{ localStorage.setItem(LSK,JSON.stringify(P)); }catch(e){}
  if(DBDOC){ const snap=JSON.parse(JSON.stringify(P)); saving=saving.then(async()=>{ try{ const cur=await DBDOC.get(); const m=cur.exists?mergeP(cur.data(),snap):snap; await DBDOC.set(m); P=mergeP(P,m); setCloud('cloud'); }catch(e){ setCloud('err'); } }); }

function buildQuiz(it){
  let pool, n, rev=[];
  if(it.final){ const by=CHAPTERS.filter(c=>!c.final).map(c=>shuffle(c.topics.flatMap(t=>POOLS[t.id].map(q=>({...q,_t:t.id})))).sort((a,b)=>(P.seen[a.id]||0)-(P.seen[b.id]||0))); const qs=[]; let k=0; while(qs.length<FINAL_N && by.some(x=>x.length)){ const x=by[k++%by.length]; if(x.length) qs.push(x.shift()); }
    return shuffle(qs).map(q=>{ if(q.type) return {...q,ans:null,inf:q.inf?cloneInf(q.inf):q.inf}; const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0}))); return {...q,opts,ans:null}; }); }
  if(it.kind==='topic'){ pool=POOLS[it.id].map(q=>({...q,_t:it.id})); n=8; }
  else { pool=it.ch.topics.flatMap(t=>POOLS[t.id].map(q=>({...q,_t:t.id}))); n=20;
    const prev=CHAPTERS.filter(c=>c.id<it.ch.id).flatMap(c=>c.topics.flatMap(t=>POOLS[t.id].map(q=>({...q,_t:t.id,_rev:true})))); if(prev.length) rev=prev; }
  const order=arr=>shuffle(arr).sort((a,b)=>(P.seen[a.id]||0)-(P.seen[b.id]||0));
  let qs;
  if(rev.length){ const nr=Math.round(n*0.2); qs=[...order(pool).slice(0,n-nr),...order(rev).slice(0,nr)]; }
  else if(it.kind==='exam'){ // spread across topics
    const by={}; for(const q of order(pool)) (by[q._t]=by[q._t]||[]).push(q); qs=[]; let k=0; const keys=Object.keys(by); while(qs.length<n && keys.some(x=>by[x].length)){ const x=keys[k++%keys.length]; if(by[x].length) qs.push(by[x].shift()); } }
  else qs=order(pool).slice(0,n);
  qs=shuffle(qs).map(q=>{ if(q.type) return {...q,ans:null,inf:q.inf?cloneInf(q.inf):q.inf}; const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0}))); return {...q,opts,ans:null}; });
  return qs;
}

    if(!r){ const why=[]; for(const b of ev.bad) why.push(`${nmPlain(b.n)}: nedrīkst. ${b.why}`); if(ev.under) why.push('Nav izlietoti visi operācijas punkti.'); if(!ev.goal&&q.goal) why.push('Uzdevums nav izpildīts: '+q.goal);
      L.push(`<div class="opt wrong" style="margin-top:6px;display:block">${why.join('<br>')||'Nav atbildes.'}</div><div class="opt right" style="margin-top:6px">Piemērs, kas der: ${q.sol.map(nmPlain).join(', ')}</div>`); }
    return L.join(''); }
  if(q.type==='multi'){ const a=q.ans||[]; const miss=q.ok.filter(n=>!a.includes(n)), extra=a.filter(n=>!q.ok.includes(n));
    return `<div class="opt ${r?'right':'wrong'}">Tu atzīmēji: ${a.length?a.map(nmPlain).join(', '):'—'}</div>${r?'':`<div class="opt right" style="margin-top:6px;display:block">Pareizās: ${q.ok.map(nmPlain).join(', ')}${miss.length?`<br>Pietrūka: ${miss.map(nmPlain).join(', ')}`:''}${extra.length?`<br>Lieki: ${extra.map(nmPlain).join(', ')}`:''}</div>`}`; }
  if(q.type==='num') return `<div class="opt ${r?'right':'wrong'}">Tava atbilde: ${q.ans}${q.unit?' '+q.unit:''}</div>${r?'':`<div class="opt right" style="margin-top:6px">Pareizi: ${q.n}${q.unit?' '+q.unit:''}</div>`}`;
  return null; }
function finishQuiz(){ const V=VIEW, it=V.it; const right=V.qs.filter(isRight).length; const sc=Math.round(right/V.qs.length*100); const th=it.final?FINAL_TH:80; const ok=sc>=th;
  for(const q of V.qs) P.seen[q.id]=(P.seen[q.id]||0)+1;
  const prev=P.done[it.id]||{best:0,att:0,ok:false}; P.done[it.id]={best:Math.max(prev.best,sc),att:prev.att+1,ok:prev.ok||ok}; save();
  VIEW={name:'result',it,qs:V.qs,sc,ok,right,th}; render(); window.scrollTo(0,0); }

// Full question in a separate window (for screenshots)
function openQ(q,k,r,body){
  const ov=h('div',{cls:'qmodal',role:'dialog','aria-modal':'true','aria-label':'Jautājums'}); const box=h('div',{cls:'qcard qm-in'});
  box.innerHTML=`<div class="qhead"><span>Jautājums ${k+1} · ${r?'<i class=mk-ok></i> Pareizi':'<i class=mk-no></i> Nepareizi'}</span><button class="btn ghost qm-x" style="min-height:36px;padding:2px 12px;font-size:17px">Aizvērt ✕</button></div>
   <div class="qtext">${q.q}</div><div class="qm-vis">${q.v&&!q.v.map?visHTML(q.v):''}</div>${body}<div class="rev ${r?'ok':'no'}">${q.e}<div class="src">Avots: ${esc(q.s)}</div></div>`;
  ov.appendChild(box); document.body.appendChild(ov); document.body.style.overflow='hidden';
  const vis=box.querySelector('.qm-vis');
  if(q.v&&q.v.map){ const hl=q.v.hl||[]; const mv=mapView(vis,{view:typeof q.v.map==='string'?VIEWS[q.v.map]:q.v.map,supers:hl.some(n=>SUPER[n]),cls:n=>hl.includes(n)?'on':'',tokens:q.v.tok,inf:q.v.inf,clean:!!q.v.inf||q.v.clean}); mapTools(vis,mv,false); vis.insertAdjacentHTML('beforeend',visHTML({img:q.v.img,imgs:q.v.imgs,cards:q.v.cards,html:q.v.html,dice:q.v.dice})); }
  else if(['map','multi','place'].includes(q.type)){
    const view=typeof q.view==='string'?VIEWS[q.view]:q.view; const a=q.ans||[];
    const inf=q.type==='place'?applyPlacements(q.side,q.inf,a).inf:q.inf;
    const cls=n=>{ if(q.type==='map') return n===q.ans?(q.ok.includes(n)?'good':'badc'):(q.hl||[]).includes(n)?'srcc':'';
      if(q.type==='multi') return a.includes(n)?(q.ok.includes(n)?'good':'badc'):q.ok.includes(n)?'miss':(q.hl||[]).includes(n)?'srcc':'';
      return a.includes(n)?'srcc':''; };
    const mv=mapView(vis,{view,supers:!!q.supers,inf,clean:true,cls}); mapTools(vis,mv,false);
    vis.appendChild(h('div',{cls:'src',style:'margin:4px 0 8px'},q.type==='place'?'Kartē redzams stāvoklis pēc tava gājiena.':q.type==='multi'?'Zaļš: pareizi atzīmēta. Sarkans: lieki atzīmēta. Zaļa svītrota līnija: pietrūka.':'Zaļš: pareiza izvēle. Sarkans: nepareiza.'));
  }
  const close=()=>{ ov.remove(); document.body.style.overflow=''; };
  box.querySelector('.qm-x').onclick=close; ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.addEventListener('keydown',function f(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',f);} });
}

function setupSim(el, side){
  const US=side==='US';
  const fixed=US?{'Canada':2,'Iran':1,'Israel':1,'Japan':1,'Australia':4,'Philippines':1,'South Korea':1,'Panama':1,'South Africa':1,'UK':5}:{'Syria':1,'Iraq':1,'North Korea':3,'E. Germany':3,'Finland':1};
  const total=US?25:15, freeN=US?7:6, freeOk=US?inWE:inEE, freeLab=US?'Rietumeiropā':'Austrumeiropā';
  const sovEx={'Syria':1,'Iraq':1,'North Korea':3,'E. Germany':3,'Finland':1,'Poland':3,'Hungary':1,'Czechoslovakia':1,'Romania':1};
  const usEx={'Canada':2,'Iran':1,'Israel':1,'Japan':1,'Australia':4,'Philippines':1,'South Korea':1,'Panama':1,'South Africa':1,'UK':5,'W. Germany':4,'Italy':3};
  const groups=[['Eiropa',Object.keys(C).filter(n=>topR(n)==='EU')],['Tuvie Austrumi',['Syria','Iraq','Iran','Israel','Lebanon','Egypt']],['Āzija',['North Korea','South Korea','Japan','Taiwan','Philippines','Australia','Afghanistan']],['Amerika un Āfrika',['Mexico','Cuba','Panama','South Africa','Angola']]];
  const pl={...fixed}; let mode=1;
  el.innerHTML=`<p>Tu esi <b>${US?'ASV':'PSRS'}</b>. Kartē atzīmētā fiksētā ietekme jau ir salikta. Tev jāizvieto <b>${freeN} brīvās</b> ietekmes: uzklikšķini uz valsts, lai pievienotu (vai noņemtu, ja ieslēgts "−1"). ${US?'PSRS ietekme jau ir uz kartes (oficiālais piemērs).':''}</p>
   <div class="row" style="position:sticky;top:0;z-index:5;background:var(--panel);padding:6px 0"><span class="lbl" id="cnt"></span><span class="maptools" id="md"></span><button class="btn sec" id="chk">Pārbaudīt</button><button class="btn ghost" id="ex">Oficiālais piemērs</button><button class="btn ghost" id="cl">Notīrīt</button></div>
   <div id="out" class="res" hidden></div><div id="g"></div>`;
  const md=$('#md',el); const setMode=v=>{mode=v;md.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===v)));};
  for(const v of [1,-1]){ const b=btn(v>0?'+1':'−1','chip',()=>setMode(v)); b.dataset.v=v; md.appendChild(b);} setMode(1);
  const draw=()=>{ const g=$('#g',el); g.innerHTML=''; for(const [lab,ns] of groups){ g.appendChild(h('div',{cls:'lbl',style:'margin:10px 0 4px'},lab)); const bx=h('div',{cls:'boxes'});
      bx.innerHTML=ns.map(n=>cbox(n,US?(pl[n]||0):(0),US?(sovEx[n]||0):(pl[n]||0))).join(''); bx.querySelectorAll('.cbox').forEach(b=>b.onclick=()=>{ const n=b.dataset.n; const sum=Object.values(pl).reduce((a,x)=>a+x,0); if(mode>0&&sum>=total) return; pl[n]=Math.max(fixed[n]||0,(pl[n]||0)+mode); if(!pl[n]) delete pl[n]; draw(); }); g.appendChild(bx); }
    const sum=Object.values(pl).reduce((a,x)=>a+x,0); $('#cnt',el).textContent=`Brīvās izliktas ${sum-(total-freeN)} / ${freeN}`; };
  $('#chk',el).onclick=()=>{ const errs=[]; const sum=Object.values(pl).reduce((a,x)=>a+x,0); if(sum!==total) errs.push(`Jāizvieto tieši ${freeN} brīvās ietekmes, tagad ir ${sum-(total-freeN)}.`);
    for(const [n,v] of Object.entries(fixed)) if((pl[n]||0)<v) errs.push(`${nmPlain(n)}: vajag vismaz ${v}.`);
    let free=0; for(const [n,v] of Object.entries(pl)){ const extra=v-(fixed[n]||0); if(extra>0){ if(!freeOk(n)) errs.push(`${nmPlain(n)}: brīvās ietekmes drīkst likt tikai ${freeLab} (${nmPlain(n)} ir ${RNAME[C[n].r]}).`); free+=extra; } }
    const o=$('#out',el); o.hidden=false; if(errs.length) resBox(o,false,'Vēl nav pareizi:<ul style="margin:4px 0;padding-left:1.2em">'+errs.map(e=>`<li>${e}</li>`).join('')+`</ul><div class="src">RB ${US?'3.3':'3.2'} (6. lpp.)</div>`);
    else resBox(o,true,`<i class=mk-ok></i> Pareizi! Visas ${freeN} brīvās ietekmes ir ${freeLab}. Ja ietekmes pietiek kontrolei, žetons rāda tumšo pusi.<div class="src">RB ${US?'3.3':'3.2'} (6. lpp.)</div>`); };
  $('#ex',el).onclick=()=>{ for(const k in pl) delete pl[k]; Object.assign(pl,US?usEx:sovEx); draw(); const o=$('#out',el); o.hidden=false; resBox(o,true,`Oficiālais piemērs no Background Book (2. lpp.). Brīvās: ${US?'Rietumvācija 4, Itālija 3':'Polija 3, Ungārija 1, Čehoslovākija 1, Rumānija 1'}.`); };
  $('#cl',el).onclick=()=>{ for(const k in pl) delete pl[k]; Object.assign(pl,fixed); $('#out',el).hidden=true; draw(); };
  draw();
}

// Reusable influence-placement board. Returns {list, reset(), eval()}.
function placeBoard(el, o){
  const list=[]; el.innerHTML='';
  const head=h('div',{cls:'opsbar'}), mapHost=h('div'), row=h('div',{cls:'maptools'}), log=h('div',{cls:'info'});
  el.append(head,mapHost,row,log);
  const mv=mapView(mapHost,{view:viewOf(o.view),clean:true,inf:()=>applyPlacements(o.side,o.inf,list).inf,cls:n=>{ if(list.includes(n)) return 'srcc'; if(o.showOk&&o.showOk()&&canPlace(o.side,o.inf,n).ok) return 'nb'; return ''; },onClick:n=>{
    const r=applyPlacements(o.side,o.inf,list); const lg=canPlace(o.side,o.inf,n);
    if(!lg.ok){ log.innerHTML=`<i class=mk-no></i> <b>${nmPlain(n)}</b>: nedrīkst. ${lg.why}`; return; }
    const c=placeCost(o.side,r.inf,n); if(r.spent+c>o.ops){ log.innerHTML=`<i class=mk-no></i> <b>${nmPlain(n)}</b>: marķieris maksātu ${c}, bet atlikuši tikai ${o.ops-r.spent}.`; return; }
    list.push(n); upd(); mv.redraw(); }});
  mapTools(mapHost,mv,!!o.views);
  row.append(btn('↶ Atcelt pēdējo','chip',()=>{ list.pop(); upd(); mv.redraw(); }), btn('Sākt no jauna','chip',()=>{ list.length=0; upd(); mv.redraw(); }));
  function upd(){ const r=applyPlacements(o.side,o.inf,list);
    head.innerHTML=`${sideTag(o.side)} Operācijas punkti: ${'<i class="op on"></i>'.repeat(Math.max(0,o.ops-r.spent))}${'<i class="op"></i>'.repeat(Math.min(o.ops,r.spent))} <b>${o.ops-r.spent}</b> no ${o.ops} atlikuši`;
    if(!list.length){ log.innerHTML=o.hint||'Klikšķini uz valsts, lai noliktu 1 marķieri. Katrs klikšķis ir viens marķieris.'; }
    else { const tmp=cloneInf(o.inf); log.innerHTML=r.steps.map((s,i)=>{ const before=ctrlOf(s.n,...iv(tmp,s.n)); const v=iv(tmp,s.n).slice(); v[sIx(o.side)]++; tmp[s.n]=v; const after=ctrlOf(s.n,...v);
      const why=s.cost===2?`maksā 2, jo valsti kontrolē ${SIDE_LV[before]}`:before===o.side?'maksā 1, jo valsti kontrolē tu':'maksā 1, jo valsti neviens nekontrolē';
      const ch=before!==after?(after?` → tagad <b>${SIDE_LV[after]} kontrole</b>`:` → <b>${SIDE_LV[before]} kontrole zūd</b>`):'';
      return `${i+1}. <b>${nmPlain(s.n)}</b> ${iv(tmp,s.n).join('/')} · ${why}${ch}`; }).join('<br>'); }
    if(o.onChange) o.onChange(list,r); }
  upd();
  return {list, redraw:()=>mv.redraw(), reset(){ list.length=0; upd(); mv.redraw(); }, eval:()=>applyPlacements(o.side,o.inf,list)};
}

  const head=()=>`DEFCON ir 5 (apvērsums atļauts visur). ${sideTag(s.side)} veic apvērsumu valstī <b>${nm(s.n)}</b> (stabilitāte <b>${C[s.n].s}</b>). Kārts: <b>${s.ops}</b> operācijas punkti. Ietekme: ${infList(inf,[s.n])}.`;

    resBox($('#r3',el),ok,`${ok?'<i class=mk-ok></i> Pareizi!':'<i class=mk-no></i> Ne gluži.'} ${ex}<br>${SIDE_LV[s.side]} militāro operāciju marķieris pārvietojas par <b>${s.ops}</b> (arī, ja apvērsums neizdodas).`);
    inf=R.inf; mv.redraw(); $('#tt',el).innerHTML=head().replace('Ietekme:','Ietekme tagad:'); $('#c3',el).hidden=true; };

function rndScenario(noAuto){ for(let k=0;k<50;k++){ const reg=rpick(['CA','SA','ME','AF','AS','EU']), inf={}, lead=Math.random()<.6?rpick(['US','USSR']):null;
  for(const n of regionCountries(reg)){ const r=Math.random(), pu=lead==='US'?.42:lead==='USSR'?.18:.28, ps=lead==='USSR'?.42:lead==='US'?.18:.28;
    if(r<pu) inf[n]=[C[n].s+(Math.random()<.3?1:0), Math.random()<.2?1:0];
    else if(r<pu+ps) inf[n]=[Math.random()<.2?1:0, C[n].s+(Math.random()<.3?1:0)];
    else if(r<pu+ps+.1) inf[n]=Math.random()<.5?[1,0]:[0,1]; }
  for(const n in inf){ const [u,v]=inf[n]; if(u===0&&v===0) delete inf[n]; }
  const R=scoreRegion(reg,inf); if(noAuto&&R.auto) continue; if(!R.US.lv&&!R.USSR.lv) continue; return {reg, inf, lab:'Nejaušs'}; }

  const W=s=>`${s}`, R={US:'ASV uzvar', USSR:'PSRS uzvar', draw:'Neizšķirts', go:'Spēle turpinās'};
  const T=[
    ()=>{ const s=rpick(['US','USSR']), p=rint(15,19), n=rint(1,5), np=p+n; return {t:`${AF} marķieris ir uz <b>${SIDE_LV[s]} ${p}</b>. Kārts notikums: ${SIDE_LV[s]} saņem ${n} VP.`, ok:np>=20?s:'go', why:np>=20?`${p} + ${n} ≥ 20: ${SIDE_LV[s]} uzreiz uzvar.`:`${SIDE_LV[s]} ${np}. 20 nav sasniegts.`}; },
    ()=>{ const p=rint(15,19), a=rint(3,9), b=rint(1,8), d=a-b, np=p+d; return {t:`Marķieris ir uz <b>PSRS ${p}</b>. Vērtēšanā PSRS saņem ${a} VP, ASV saņem ${b} VP.`, ok:np>=20?'USSR':'go', why:`Vispirms starpība: ${d>=0?`PSRS +${d}`:`ASV +${-d}`}. Marķieris: ${vpTxt(np)}. ${np>=20?'PSRS sasniedz 20 un uzvar.':'20 nav sasniegts.'}`}; },
    ()=>{ const s=rpick(['US','USSR']); return {t:`Fāze <b>Check for Held Scoring Card</b>. ${SIDE_LV[s]} rokā ir vērtēšanas kārts.`, ok:OTHER(s), why:`${SIDE_LV[s]} uzreiz zaudē: vērtēšanas kārti nedrīkst turēt rokā.`}; },
    ()=>{ const s=rpick(['US','USSR']), lv=rpick(['Kontrole','Dominēšana','Klātbūtne']); return {t:`${AF} izspēlē <b>Europe Scoring</b>. ${SIDE_LV[s]} ir Eiropas <b>${lv}</b>.`, ok:lv==='Kontrole'?s:'go', why:lv==='Kontrole'?`Eiropas Kontrole: ${SIDE_LV[s]} uzreiz uzvar.`:`${lv} dod VP pēc tabulas. Uzvara ir tikai ar Eiropas Kontroli (vai 20 VP).`}; },
    ()=>{ const s=rpick(['US','USSR']); return {t:`${AF}, ${SIDE_LV[s]} Action kārtā, DEFCON nokrīt līdz <b>1</b>.`, ok:OTHER(s), why:`Zaudē aktīvais spēlētājs (${SIDE_LV[s]}). Uzvar ${SIDE_LV[OTHER(s)]}.`}; },
    ()=>{ const s=rpick(['US','USSR']); return {t:`<b>Virsraksta fāzē</b> ${SIDE_LV[s]} izspēlē pretinieka kārti. Notikumu izpilda ${SIDE_LV[OTHER(s)]}, un DEFCON nokrīt līdz <b>1</b>.`, ok:OTHER(s), why:`Virsraksta fāzē aktīvais spēlētājs ir tas, kurš izspēlēja kārti: ${SIDE_LV[s]}. ${SIDE_LV[s]} zaudē.`}; },
    ()=>{ const p=rint(-2,2), h=rpick(['US','USSR']), np=vpMove(p,h,1), ok=np===0?'draw':np<0?'US':'USSR'; return {t:`<b>Final Scoring</b> pēc 10. gājiena: visi reģioni ir novērtēti, marķieris ir uz <b>${vpTxt(p)}</b>. China Card ir ${SIDE_LV[h]}.`, ok, why:`China Card: ${SIDE_LV[h]} +1 VP. Marķieris: ${vpTxt(np)}. ${ok==='draw'?'Uz 0: neizšķirts.':`Uzvar ${SIDE_LV[ok]}.`}`}; },
    ()=>{ const s=rpick(['US','USSR']), held=Math.random()<.5; return {t:`Fāzē <b>Check Military Operations Status</b> ${SIDE_LV[s]} sasniedz 20 VP. ${SIDE_LV[s]} parāda rokas kārtis: vērtēšanas kārts ${held?'<b>ir</b>':'<b>nav</b>'}.`, ok:held?OTHER(s):s, why:held?`Rokā ir vērtēšanas kārts: ${SIDE_LV[s]} zaudē.`:`Vērtēšanas kārts nav: ${SIDE_LV[s]} uzvar.`}; },
    ()=>{ const s=rpick(['US','USSR']), p=rint(10,17); return {t:`${AF} marķieris ir uz <b>${SIDE_LV[s]} ${p}</b>. ${SIDE_LV[s]} izspēlē vērtēšanas kārti un iegūst 2 VP vairāk nekā pretinieks.`, ok:'go', why:`${SIDE_LV[s]} ${p+2}. 20 nav sasniegts.`}; },
  ];
  function game(){ const g=$('#g',el); let i=0, right=0; const N=8, seq=[];
    while(seq.length<N){ const f=rpick(T); if(seq.filter(x=>x===f).length<2) seq.push(f); }
    const ask=()=>{ if(i>=N){ g.innerHTML=`<div class="res ${right>=N-1?'ok':'no'}">Rezultāts: ${right} no ${N}.</div>`; g.appendChild(btn('Vēlreiz ↻','chip',game)); return; }
      const sc=seq[i](); let done=false;
      g.innerHTML=`<div class="lbl">${i+1}/${N}</div><p style="font-size:18px">${sc.t}</p><div class="maptools" id="a"></div><div class="res" id="x" hidden></div>`;
      for(const k of ['US','USSR','draw','go']) $('#a',g).appendChild(btn(R[k],'chip',()=>{ if(done) return; done=true; const ok=k===sc.ok; if(ok) right++;
        const x=$('#x',g); x.hidden=false; resBox(x,ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} <b>${R[sc.ok]}.</b> ${sc.why}`); i++; x.after(btn(i>=N?'Rezultāts →':'Tālāk →','chip',ask)); }));
    };
    ask(); }
  game();
};

// generic runner: gen() -> {html, opts:[[label, correct]], why, post?(host)}
function simQuiz(el, intro, gen, N=8){
  el.innerHTML=`<p>${intro}</p><div id="g"></div>`;
  function game(){ const g=$('#g',el); let i=0, right=0;
    const ask=()=>{ if(i>=N){ g.innerHTML=`<div class="res ${right>=N-1?'ok':'no'}">Rezultāts: ${right} no ${N}.</div>`; g.appendChild(btn('Vēlreiz ↻','chip',game)); return; }
      const it=gen(i); let done=false;
      g.innerHTML=`<div class="lbl">${i+1}/${N}</div>${it.html}<div class="maptools" id="a"></div><div class="res" id="x" hidden></div>`;
      if(it.post) it.post(g);
      for(const [lab,ok] of shuffle(it.opts,Math.random)) $('#a',g).appendChild(btn(lab,'chip',()=>{ if(done) return; done=true; if(ok) right++;
        const x=$('#x',g); x.hidden=false; resBox(x,ok,`${ok?'<i class=mk-ok></i> Pareizi.':'<i class=mk-no></i> Nē.'} ${it.why}`); i++; x.after(btn(i>=N?'Rezultāts →':'Tālāk →','chip',ask)); }));
    }; ask(); }
  game();
}

// --- 14.3 Play any card: three questions per card
SIMS.cardflow = el => {
  el.innerHTML=`<p>Tev rokā ir kārts. Ej cauri soļiem: <b>vai drīkst notikumu</b>, <b>vai notikums notiek</b>, <b>kur kārts paliek</b>.</p><div id="g"></div>`;
  const pool=BKC.filter(c=>!c.scoring&&c.k!=='china');
  function game(){ const g=$('#g',el); let n=0, right=0, total=0; const N=4;
    const next=()=>{ if(n>=N){ g.innerHTML=`<div class="res ${right>=total-1?'ok':'no'}">Rezultāts: ${right} no ${total}.</div>`; g.appendChild(btn('Vēlreiz ↻','chip',game)); return; }
      const c=rpick(pool), p=rpick(['US','USSR']); const own=c.side===p||c.side==='both';
      const mode = own ? rpick(['event','ops','space']) : rpick(['ops','space']);
      const occurs = mode==='event' || (mode==='ops' && !own);
      const modeLV={event:'kā notikumu',ops:'operācijas punktiem',space:'kosmosa sacīkstēm'}[mode];
      const steps=[
        {q:`Vai <b>${SIDE_LV[p]}</b> drīkst izspēlēt šo kārti kā <b>savu notikumu</b>?`, opts:[['Jā',own],['Nē, tikai operācijām',!own]], why:own?`Zvaigzne: ${STARLV[c.side]}. Savu vai pelēko kārti drīkst izspēlēt kā notikumu.`:`Zvaigzne: ${STARLV[c.side]}. Pretinieka kārti drīkst izspēlēt tikai operācijām (vai kosmosa sacīkstēm).`},
        {q:`${SIDE_LV[p]} izspēlē kārti <b>${modeLV}</b>${mode==='space'?' (pieņem, ka tas ir atļauts)':''}. Vai notikums notiek?`, opts:[['Jā',occurs],['Nē',!occurs]], why: mode==='event'?'Izvēlēts notikums: tas notiek.':mode==='space'?'Kosmosa sacīkstēs notikums nekad nenotiek.':own?'Sava (vai pelēkā) kārts operācijām: notikums nenotiek.':'Pretinieka kārts operācijām: pretinieka notikums notiek automātiski.'},
        {q:`Kur kārts paliek pēc izspēles? (Pieņem, ka notikuma nosacījumi ir izpildīti.)`, opts:[['Trash kavā',occurs&&c.star],['Discard kavā',!(occurs&&c.star)]], why: occurs&&c.star?'Notikums notika, un aiz nosaukuma ir zvaigznīte (*): Trash kava.':occurs?'Notikums notika, bet zvaigznītes nav: Discard kava.':'Notikums nenotika: kārts iet uz Discard kavu.'}];
      let s=0;
      const ask=()=>{ if(s>=steps.length){ n++; next(); return; } const st=steps[s]; let done=false;
        g.innerHTML=`<div class="lbl">Kārts ${n+1}/${N} · solis ${s+1}/3</div>${cardImgHTML(c.f)}<p>Tu esi <b>${SIDE_LV[p]}</b>. Kārts: <b>${c.t}</b>.</p><p style="font-size:19px">${st.q}</p><div class="maptools" id="a"></div><div class="res" id="x" hidden></div>`;
        for(const [lab,ok] of st.opts) $('#a',g).appendChild(btn(lab,'chip',()=>{ if(done) return; done=true; total++; if(ok) right++;
          const x=$('#x',g); x.hidden=false; resBox(x,ok,`${ok?'<i class=mk-ok></i> Pareizi.':'<i class=mk-no></i> Nē.'} ${st.why}`); s++; x.after(btn('Tālāk →','chip',ask)); }));
      }; ask(); };
    next(); }
  game();
};

// ===== Mini-games for chapter 15: play turn 1 step by step (BB example)
function t1walk(el, from, to){
  el.innerHTML=`<p>Tu esi pie galda. Katrā solī paskaties uz karti, kārti un trasēm, tad izvēlies, kas notiek.</p><div id="g"></div>`;
  function run(){ const g=$('#g',el); let i=from, right=0;
    const ask=()=>{ if(i>=to){ const n=to-from; g.innerHTML=`<div class="res ${right>=n-1?'ok':'no'}">Rezultāts: ${right} no ${n}.</div>${t1Status(T1S[to])}`; g.appendChild(btn('No sākuma ↻','chip',run)); return; }
      const s=T1[i], st=T1S[i]; let done=false;
      const who=s.who?`<span class="side ${s.who==='US'?'us':'su'}">${SIDE_LV[s.who]}</span> `:'';
      g.innerHTML=`<div class="lbl">${i-from+1}/${to-from} · ${s.lab}</div><h3 style="margin:4px 0">${who}${s.title}</h3>${t1Status(st)}<div id="m"></div>
        ${(s.card||[]).map(ktHTML).join('')}${s.score?RTAB(s.score):''}${s.dice?`<div class="dicebox">${s.dice.map(d=>`<div><div class="lbl">${SIDE_LV[d[0]]} metiens</div>${dieSVG(d[1],d[0])}</div>`).join('')}</div>`:''}
        ${(s.imgs||[]).map(f=>`<div style="text-align:center;margin:6px 0"><img src="img/${f}" alt="" style="max-height:160px;max-width:100%;border-radius:6px" data-zoom="1"></div>`).join('')}
        <p style="font-size:19px"><b>${s.ask.q}</b></p><div class="maptools" id="a"></div><div class="res" id="x" hidden></div>`;
      const mh=$('#m',g); const mv=mapView(mh,{view:s.view, inf:st.inf, clean:Object.keys(st.inf).length>0, supers:false, cls:n=>(s.hl||[]).includes(n)?'on':''}); mapTools(mh,mv,true);
      for(const [k,lab] of shuffle(s.ask.o.map((t,j)=>[j,t]),Math.random)) $('#a',g).appendChild(btn(lab,'chip',()=>{ if(done) return; done=true; const ok=k===0; if(ok) right++;
        const x=$('#x',g); x.hidden=false;
        resBox(x,ok,`${ok?'<i class=mk-ok></i> Pareizi.':'<i class=mk-no></i> Nē. Pareizi: <b>'+s.ask.o[0]+'</b>.'} ${s.ask.e}<br><br><b>Kas notiek:</b> ${s.did}<br><b>Kur skatīties:</b> ${s.look}${s.img?`<div style="text-align:center;margin-top:8px"><img src="img/${s.img}" alt="" style="max-height:260px;max-width:100%;border-radius:6px" data-zoom="1"><div class="src">BB oficiālais piemērs</div></div>`:''}`);
        const after=T1S[i+1]; mh.innerHTML=''; const mv2=mapView(mh,{view:s.view, inf:after.inf, clean:Object.keys(after.inf).length>0, cls:n=>(s.hl||[]).includes(n)?'on':''}); mapTools(mh,mv2,true);
        mh.insertAdjacentHTML('afterbegin','<div class="src" style="margin:4px 0">Karte pēc šī soļa:</div>');
        i++; x.after(btn(i>=to?'Rezultāts →':'Tālāk →','chip',ask)); }));
    }; ask(); }
  run();
}
SIMS.t1a = el => t1walk(el, 0, 6);
SIMS.t1b = el => t1walk(el, 6, 12);
SIMS.t1c = el => t1walk(el, 12, T1.length);

// ===== Treniņu zona: random practice scenarios built only on rules taught in chapters 6–10.
const TR_LS = 'ts_train_v1';
const trLoad = () => { try { return JSON.parse(localStorage.getItem(TR_LS)||'{}'); } catch(e){ return {}; } };
const trSave = o => { try { localStorage.setItem(TR_LS, JSON.stringify(o)); } catch(e){} };
const rint = (a,b) => a+Math.floor(Math.random()*(b-a+1));
const rpick = a => a[Math.floor(Math.random()*a.length)];
const rside = () => Math.random()<.5?'US':'USSR';
const ACT = side => `Action fāzē, ${SIDE_LV[side]} Action kārtā`;
const DTRACK = d => `<div class="lbl" style="margin-top:6px">DEFCON tagad: ${d}</div>${defBar(d)}<div style="text-align:center"><img src="img/defcon_track.jpg" alt="DEFCON trase" style="max-width:100%;max-height:150px;border-radius:8px" data-zoom="1"></div>`;
const SUPER_NOTE = cl => { const a=cl.filter(n=>C[n].adj.includes('USA')), b=cl.filter(n=>C[n].adj.includes('USSR')); return [a.length?`Blakus ASV laukumam: ${a.map(nmPlain).join(', ')}.`:'', b.length?`Blakus PSRS laukumam: ${b.map(nmPlain).join(', ')}.`:''].filter(Boolean).join(' '); };

// A random cluster of 5–7 neighbouring countries
function trCluster(){ for(let t=0;t<50;t++){ const seed=rpick(Object.keys(C)), out=[seed], q=[seed];
    while(q.length && out.length<7){ const c=q.shift(); for(const a of shuffle(C[c].adj)) if(C[a]&&!out.includes(a)&&out.length<7){ out.push(a); q.push(a); } }
    if(out.length>=5) return out; } return ['Mexico','Guatemala','El Salvador','Honduras','Nicaragua']; }
function trInf(cl, p=.6){ const o={}; for(const n of cl){ if(Math.random()>p) continue; const v=[0,0], s=Math.random()<.5?0:1; v[s]=rint(1,C[n].s+2); if(Math.random()<.3) v[1-s]=rint(1,2); o[n]=v; } return o; }
const trInfTxt = (inf, cl) => { const t=infList(inf, cl.filter(n=>inf[n]&&(inf[n][0]||inf[n][1]))); return t||'nevienā valstī nav ietekmes'; };

// --- Drill 1: where may influence be placed? (RB 6.1)
function drWhere(host, done){
  const inside=v=>Object.keys(C).filter(n=>{ const b=C[n].b; return b[0]>=v[0]&&b[1]>=v[1]&&b[0]+b[2]<=v[0]+v[2]&&b[1]+b[3]<=v[1]+v[3]; });
  let side, cl, inf, ok, view, cand; for(let t=0;t<40;t++){ side=rside(); cl=trCluster(); inf=trInf(cl,.45); view=BOX(...cl); cand=inside(view); ok=cand.filter(n=>canPlace(side,inf,n).ok); if(ok.length&&ok.length<cand.length) break; }
  const sel=[]; let fin=false;
  host.innerHTML=`<p>${ACT(side)}: ${sideTag(side)} grib likt <b>ietekmi</b>. Atzīmē <b>visas</b> valstis zilā rāmī, kur ${SIDE_LV[side]} drīkst likt ietekmes marķieri. Ietekme kartē ir tāda, kāda tā ir šīs Action kārtas sākumā. Citur kartē ietekmes nav. ${SUPER_NOTE(cand)}</p><div id="mp"></div><div class="info" id="i"></div><div class="maptools"><button class="btn sec" id="ck">Pārbaudīt</button></div><div class="res" id="r" hidden></div>`;
  const mv=mapView($('#mp',host),{view,clean:true,inf,cls:n=>!cand.includes(n)?'dim':fin?(ok.includes(n)?(sel.includes(n)?'good':'nb'):(sel.includes(n)?'badc':'')):(sel.includes(n)?'on':'srcc'),onClick:n=>{ if(fin||!cand.includes(n)) return; const i=sel.indexOf(n); i>=0?sel.splice(i,1):sel.push(n); upd(); mv.redraw(); }}); mapTools($('#mp',host),mv,false);
  const upd=()=>{ $('#i',host).innerHTML=sel.length?`Atzīmētas (${sel.length}): ${sel.map(nmPlain).join(', ')}`:'Klikšķini uz valstīm zilā rāmī. Pelēkās ir tikai daļēji redzamas, tās neskaitās.'; }; upd();
  $('#ck',host).onclick=()=>{ if(fin) return; fin=true; mv.redraw(); const good=sameSet(sel,ok); $('#r',host).hidden=false; $('#ck',host).hidden=true;
    const miss=ok.filter(n=>!sel.includes(n)), wrong=sel.filter(n=>!ok.includes(n)), why=n=>`<li><b>${nmPlain(n)}</b>: ${canPlace(side,inf,n).why}</li>`;
    resBox($('#r',host),good,`${good?'<i class=mk-ok></i> Pareizi!':'<i class=mk-no></i> Ne gluži.'} Zaļā rāmī ir visas valstis, kur drīkst (${ok.length}): ${ok.map(nmPlain).join(', ')}.${miss.length?`<br><b>Tu neatzīmēji, bet drīkst:</b><ul>${miss.map(why).join('')}</ul>`:''}${wrong.length?`<b>Tu atzīmēji, bet nedrīkst:</b><ul>${wrong.map(why).join('')}</ul>`:''}`); done(good); };
}

// --- Drill 2: influence mission (RB 6.1.1–6.1.3)
function drPlace(host, done){
  let side, cl, inf, tgt, need=0;
  for(let t=0;t<80;t++){ side=rside(); cl=trCluster(); inf=trInf(cl,.6);
    const cand=cl.filter(n=>canPlace(side,inf,n).ok && ctrlOf(n,...iv(inf,n))!==side); if(!cand.length) continue; tgt=rpick(cand);
    const tmp=cloneInf(inf); need=0; for(let k=0;k<10&&ctrlOf(tgt,...iv(tmp,tgt))!==side;k++){ need+=placeCost(side,tmp,tgt); const v=iv(tmp,tgt).slice(); v[sIx(side)]++; tmp[tgt]=v; }
    if(ctrlOf(tgt,...iv(tmp,tgt))===side && need>=(t<50?2:1) && need<=4) break; tgt=null; }
  if(!tgt) return drWhere(host,done);
  const ops=Math.max(2,Math.min(4,need+rint(0,1))), list=[]; let fin=false;
  host.innerHTML=`<p>${ACT(side)}: ${sideTag(side)} izspēlē kārti ar <b>${ops}</b> operācijas punktiem <b>ietekmes likšanai</b>. <b>Uzdevums:</b> iegūsti ${SIDE_LV[side]} kontroli valstī <b>${nm(tgt)}</b> (stabilitāte ${C[tgt].s}) un izlieto <b>visus</b> punktus. Kartē redzama visa ietekme. ${SUPER_NOTE(cl)}</p>
   <div class="opsbar" id="ob"></div><div id="mp"></div><div class="maptools"><button class="chip" id="un">↶ Atcelt pēdējo</button><button class="chip" id="cl">Sākt no jauna</button><button class="btn sec" id="ck">Pārbaudīt</button></div><div class="info" id="i"></div><div class="res" id="r" hidden></div>`;
  const cur=()=>applyPlacements(side,inf,list);
  const mv=mapView($('#mp',host),{view:BOX(...cl),clean:true,inf:()=>cur().inf,cls:n=>n===tgt?'on':(list.includes(n)?'srcc':''),onClick:n=>{ if(fin||!C[n]) return; const r=cur(), c=placeCost(side,r.inf,n); if(r.spent+c>ops){ $('#i',host).innerHTML=`Nepietiek punktu: valstī ${nmPlain(n)} marķieris maksā ${c}.`; return; } list.push(n); upd(); mv.redraw(); }}); mapTools($('#mp',host),mv,false);
  const upd=()=>{ const r=cur(); $('#ob',host).innerHTML=`${sideTag(side)} Operācijas punkti: ${'<i class="op on"></i>'.repeat(ops-r.spent)}${'<i class="op"></i>'.repeat(r.spent)} <b>${ops-r.spent}</b> no ${ops} atlikuši`; $('#i',host).innerHTML=list.length?`Tu noliki: ${list.map(nmPlain).join(', ')}.`:'Klikšķini uz valsts, lai noliktu 1 marķieri. Pretinieka kontrolētā valstī marķieris maksā 2.'; };
  $('#un',host).onclick=()=>{ if(fin) return; list.pop(); upd(); mv.redraw(); }; $('#cl',host).onclick=()=>{ if(fin) return; list.length=0; upd(); mv.redraw(); };
  upd();
  $('#ck',host).onclick=()=>{ if(fin) return; const r=cur(), bad=r.steps.filter(s=>!s.legal), c=ctrlOf(tgt,...iv(r.inf,tgt))===side, good=!bad.length&&c&&r.spent===ops; fin=true; $('#r',host).hidden=false; ['ck','un','cl'].forEach(i=>$('#'+i,host).hidden=true);
    const log=r.steps.map((s,i)=>`${i+1}. ${nmPlain(s.n)}: maksā ${s.cost}${s.legal?'':' <i class=mk-no></i> <b>nedrīkst</b> ('+s.why+')'}`).join('<br>');
    resBox($('#r',host),good,`${good?'<i class=mk-ok></i> Uzdevums izpildīts!':'<i class=mk-no></i> Uzdevums nav izpildīts.'}${!c?` ${nmPlain(tgt)} nav ${SIDE_LV[side]} kontrolē.`:''}${r.spent<ops?` Neizlietoti ${ops-r.spent} punkti.`:''}<br>${log||'Nekas nav nolikts.'}<br><span class="src">Atgādinājums: kontrole = vismaz stabilitātes skaitlis ietekmes un par stabilitāti vairāk nekā pretiniekam. Vieta derīga, ja ietekme tur vai kaimiņos bija Action kārtas sākumā vai valsts ir blakus savai lielvarai.</span>`); done(good); };
}

// --- Drill 3: realignment (RB 6.2, 8.1.5)
function drRealign(host, done){
  let side, cl, inf, n, d; for(let t=0;t<40;t++){ side=rside(); cl=trCluster(); inf=trInf(cl,.7); d=rint(2,5); const opp=cl.filter(x=>iv(inf,x)[sIx(OTHER(side))]>0); n=Math.random()<.8&&opp.length?rpick(opp):rpick(cl); if(Object.keys(inf).length>=3) break; }
  const can=canRealign(side,inf,n,d); let gU=0,gS=0,lw='none',gx=0;
  host.innerHTML=`<p>${ACT(side)}: ${sideTag(side)} grib veikt <b>pārorientāciju</b> valstī <b>${nm(n)}</b> (${regBg(n)}). Kartē redzama visa ietekme. ${SUPER_NOTE([n])}</p>${DTRACK(d)}<div id="mp"></div>
   <p><b>1.</b> Vai ${SIDE_LV[side]} drīkst?</p><div class="maptools" id="a1"></div><div class="res" id="r1" hidden></div><div id="s2" hidden>
   <p><b>2.</b> Cik ir katras puses modifikators?</p><div class="row" style="gap:18px;flex-wrap:wrap"><div><div class="lbl">ASV</div><div class="stepper sm" id="gU"></div></div><div><div class="lbl">PSRS</div><div class="stepper sm" id="gS"></div></div></div><div class="maptools"><button class="btn sec" id="c2">Pārbaudīt</button></div><div class="res" id="r2" hidden></div></div>
   <div id="s3" hidden><div id="dice"></div><p><b>3.</b> Kurš zaudē ietekmi un cik?</p><div class="maptools" id="lw"></div><div class="stepper sm" id="gx"></div><div class="maptools"><button class="btn sec" id="c3">Pārbaudīt</button></div><div class="res" id="r3" hidden></div></div>`;
  const mv=mapView($('#mp',host),{view:BOX(n,...C[n].adj.filter(a=>C[a])),clean:true,inf:()=>inf,cls:x=>x===n?'on':''}); mapTools($('#mp',host),mv,false);
  let a1=false, okAll=true;
  for(const [lab,v] of [['Drīkst',true],['Nedrīkst',false]]) $('#a1',host).appendChild(btn(lab,'chip',()=>{ if(a1) return; a1=true; const ok=v===can.ok; okAll=okAll&&ok; $('#r1',host).hidden=false; resBox($('#r1',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} ${can.ok?'Drīkst.':'Nedrīkst.'} ${can.why}`); if(can.ok) $('#s2',host).hidden=false; else done(okAll); }));
  stp($('#gU',host),()=>gU,v=>gU=v,0,5); stp($('#gS',host),()=>gS,v=>gS=v,0,5); stp($('#gx',host),()=>gx,v=>gx=v,0,6);
  const lwc=()=>chips($('#lw',host),[['US','ASV'],['USSR','PSRS'],['none','Neviens (neizšķirts)']],lw,v=>{lw=v;lwc();}); lwc();
  const brk=s=>{ const m=realignMods(s,inf,n); return m.length?m.map(x=>`+1 ${x[1]}`).join('; '):'nav modifikatoru'; };
  let R;
  $('#c2',host).onclick=()=>{ if(!$('#r2',host).hidden) return; const mU=modSum(realignMods('US',inf,n)), mS=modSum(realignMods('USSR',inf,n)), ok=gU===mU&&gS===mS; okAll=okAll&&ok; $('#r2',host).hidden=false;
    resBox($('#r2',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} ASV: <b>${mU}</b> (${brk('US')}). PSRS: <b>${mS}</b> (${brk('USSR')}).`);
    const ru=rint(1,6), rs=rint(1,6); R=realignResult(inf,n,ru,rs);
    $('#dice',host).innerHTML=`<div class="dicebox rolling"><div><div class="lbl">ASV</div>${dieSVG(ru,'US')}<div>${ru} + ${mU} = <b>${R.tU}</b></div></div><div><div class="lbl">PSRS</div>${dieSVG(rs,'USSR')}<div>${rs} + ${mS} = <b>${R.tS}</b></div></div></div>`; $('#s3',host).hidden=false; };
  $('#c3',host).onclick=()=>{ if(!$('#r3',host).hidden) return; const want=R.loser||'none', ok=lw===want&&(want==='none'||gx===R.removed); okAll=okAll&&ok; $('#r3',host).hidden=false;
    resBox($('#r3',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} ${R.loser?`Zaudē ${SIDE_LV[R.loser]}: starpība ${Math.max(R.tU,R.tS)} − ${Math.min(R.tU,R.tS)} = ${R.d}. Noņem <b>${R.removed}</b> ${SIDE_LV[R.loser]} ietekmi${R.removed<R.d?' (vairāk tur nav)':''}.`:'Vienādi rezultāti: nekas nenotiek.'} Savu ietekmi pārorientācijā nekad nepieliek.`);
    inf=R.inf; mv.redraw(); done(okAll); };
}

// --- Drill 4: coup (RB 6.3, 8.1.4, 8.1.5, 8.2.3)
function drCoup(host, done){
  let side, cl, inf, n, d; for(let t=0;t<40;t++){ side=rside(); cl=trCluster(); inf=trInf(cl,.7); d=rint(2,5); const opp=cl.filter(x=>iv(inf,x)[sIx(OTHER(side))]>0); n=Math.random()<.8&&opp.length?rpick(opp):rpick(cl); if(Object.keys(inf).length>=3) break; }
  const ops=rint(1,4), mil0=rint(0,3), can=canCoup(side,inf,n,d); let g1=0,g2=0,g3=0,gm=0,gd=null, okAll=true, R;
  host.innerHTML=`<p>${ACT(side)}: ${sideTag(side)} izspēlē kārti ar <b>${ops}</b> operācijas ${ops===1?'punktu':'punktiem'} <b>apvērsumam</b> valstī <b>${nm(n)}</b> (stabilitāte ${C[n].s}, ${regBg(n)}). ${SIDE_LV[side]} militāro operāciju marķieris: <b>${mil0}</b>. Kartē redzama visa ietekme.</p>${DTRACK(d)}<div id="mp"></div>
   <p><b>1.</b> Vai ${SIDE_LV[side]} drīkst?</p><div class="maptools" id="a1"></div><div class="res" id="r1" hidden></div>
   <div id="s2" hidden><p><b>2.</b> Kam jābūt <b>lielākam</b> metienam plus operācijas punktiem?</p><div class="stepper sm" id="g1"></div><div class="maptools"><button class="btn sec" id="c2">Pārbaudīt un mest</button></div><div class="res" id="r2" hidden></div></div>
   <div id="s3" hidden><div id="dice"></div><p><b>3.</b> Cik pretinieka ietekmes noņem, cik savas pieliek?</p><div class="row" style="gap:18px;flex-wrap:wrap"><div><div class="lbl">Noņem</div><div class="stepper sm" id="g2"></div></div><div><div class="lbl">Pieliek</div><div class="stepper sm" id="g3"></div></div></div>
   <p><b>4.</b> Kāds būs DEFCON un ${SIDE_LV[side]} militārās operācijas?</p><div class="maptools" id="dd"></div><div><div class="lbl">Militārās operācijas</div><div class="stepper sm" id="gm"></div></div><div class="maptools"><button class="btn sec" id="c3">Pārbaudīt</button></div><div class="res" id="r3" hidden></div></div>`;
  const mv=mapView($('#mp',host),{view:BOX(n,...C[n].adj.filter(a=>C[a])),clean:true,inf:()=>inf,cls:x=>x===n?'on':''}); mapTools($('#mp',host),mv,false);
  let a1=false;
  for(const [lab,v] of [['Drīkst',true],['Nedrīkst',false]]) $('#a1',host).appendChild(btn(lab,'chip',()=>{ if(a1) return; a1=true; const ok=v===can.ok; okAll=okAll&&ok; $('#r1',host).hidden=false; resBox($('#r1',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} ${can.ok?'Drīkst.':'Nedrīkst.'} ${can.why}`); if(can.ok) $('#s2',host).hidden=false; else done(okAll); }));
  stp($('#g1',host),()=>g1,v=>g1=v,0,12); stp($('#g2',host),()=>g2,v=>g2=v,0,8); stp($('#g3',host),()=>g3,v=>g3=v,0,8); stp($('#gm',host),()=>gm,v=>gm=v,0,5);
  const ddc=()=>chips($('#dd',host),[d,d-1].map(x=>[x,x<=1?'DEFCON 1 (spēle beidzas)':`DEFCON ${x}`]),gd,v=>{gd=v;ddc();}); ddc();
  $('#c2',host).onclick=()=>{ if(!$('#r2',host).hidden) return; const need=2*C[n].s, ok=g1===need; okAll=okAll&&ok; $('#r2',host).hidden=false; resBox($('#r2',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} Stabilitāte ${C[n].s} × 2 = <b>${need}</b>.`);
    const roll=rint(1,6); R=coupResult(side,inf,n,ops,roll); $('#dice',host).innerHTML=`<div class="dicebox rolling"><div><div class="lbl">${SIDE_LV[side]}</div>${dieSVG(roll,side)}<div>${roll} + ${ops} = <b>${R.tot}</b></div></div><div><div class="lbl">Divkāršā stabilitāte</div><div style="font:700 34px var(--f-ui);padding:8px 0">${R.need}</div></div></div>`; $('#s3',host).hidden=false; };
  $('#c3',host).onclick=()=>{ if(!$('#r3',host).hidden) return; const A=coupAfter(n,d,mil0,ops), ok=g2===R.removed&&g3===R.added&&gd===A.defcon&&gm===A.milops; okAll=okAll&&ok; $('#r3',host).hidden=false;
    resBox($('#r3',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} ${R.ok?`${R.tot} &gt; ${R.need}: izdodas. Starpība ${R.d}: noņem <b>${R.removed}</b>, pieliek <b>${R.added}</b>.`:`${R.tot} nav lielāks par ${R.need}: neizdodas, ietekme nemainās (noņem 0, pieliek 0).`}<br>${C[n].bg?`Battleground valsts: DEFCON ${d} → <b>${A.defcon}</b>${A.lose?`. <b>Spēle beidzas, ${SIDE_LV[side]} zaudē</b>`:''}.`:`Nav Battleground valsts: DEFCON paliek <b>${d}</b>.`} Militārās operācijas: ${mil0} + ${ops}${mil0+ops>5?' (maks. 5)':''} = <b>${A.milops}</b>. Tās skaitās arī, ja apvērsums neizdodas.`);

// --- Drill 5: DEFCON guard, quick decisions (RB 8.1.3–8.1.5)
function drDefcon(host, done){
  const side=rside(), d=rint(2,5), kind=rpick(['coup','coup','realign']), n=rpick(Object.keys(C)), ban=realignBan(d,n);
  const ans = ban ? 0 : (kind==='coup'&&C[n].bg ? (d-1<=1?2:1) : 3);
  const why = ban ? `DEFCON ${d}: ${kind==='coup'?'apvērsums':'pārorientācija'} ${ban} nav atļauta.` : kind==='realign' ? 'Pārorientācija DEFCON nemaina.' : C[n].bg ? `Apvērsums Battleground valstī: DEFCON ${d} → ${d-1}.${d-1<=1?` Kodolkarš: zaudē ${SIDE_LV[side]} (aktīvais spēlētājs).`:''}` : 'Valsts nav Battleground: DEFCON nemainās.';
  const opts=['Nedrīkst', `Drīkst, DEFCON kļūst ${d-1}`, `Drīkst, bet DEFCON kļūst 1: spēle beidzas, ${SIDE_LV[side]} zaudē`, `Drīkst, DEFCON paliek ${d}`];
  host.innerHTML=`<p>${ACT(side)}: ${sideTag(side)} grib veikt <b>${kind==='coup'?'apvērsumu ar operācijas punktiem':'pārorientāciju'}</b> valstī <b>${nm(n)}</b> (${regBg(n)}). Tur ir ${SIDE_LV[OTHER(side)]} ietekme. Kas notiek?</p>${DTRACK(d)}<div class="opts" id="o"></div><div class="res" id="r" hidden></div>`;
  const show=[0,1,2,3].filter(i=>!(i===1&&d-1<=1)&&!(i===2&&d!==2)); let a=false;
  for(const i of show){ const b=h('button',{cls:'opt'},opts[i]); b.onclick=()=>{ if(a) return; a=true; const ok=i===ans; b.classList.add(ok?'right':'wrong'); if(!ok) $('#o',host).querySelectorAll('.opt')[show.indexOf(ans)]?.classList.add('right'); $('#r',host).hidden=false; resBox($('#r',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} ${why}`); done(ok); }; $('#o',host).appendChild(b); }
}

// --- Drill 6: end of turn military operations (RB 8.2)
function drMil(host, done){
  const d=rint(2,5), us=rint(0,5), su=rint(0,5), P0=milPenalty(d,us,su); let who=null, g=0;
  host.innerHTML=`<p>Gājiena beigās, fāzē <b>Check Military Operations Status</b>. DEFCON ir <b>${d}</b>. ASV militārās operācijas: <b>${us}</b>. PSRS militārās operācijas: <b>${su}</b>. Kas notiek uz VP trases?</p>${DTRACK(d)}<div class="lbl">Kurš saņem VP?</div><div class="maptools" id="w"></div><div class="lbl">Cik VP?</div><div class="stepper sm" id="g"></div><div class="maptools"><button class="btn sec" id="ck">Pārbaudīt</button></div><div class="res" id="r" hidden></div>`;
  const wc=()=>chips($('#w',host),[['US','ASV'],['USSR','PSRS'],['none','Neviens']],who,v=>{who=v;wc();}); wc(); stp($('#g',host),()=>g,v=>g=v,0,5);
  $('#ck',host).onclick=()=>{ if(!$('#r',host).hidden) return; const want=P0.to||'none', ok=who===want&&(want==='none'||g===P0.net); $('#r',host).hidden=false;
    resBox($('#r',host),ok,`${ok?'<i class=mk-ok></i>':'<i class=mk-no></i>'} Vajag tik, cik DEFCON: ${d}. Ja ir vairāk, par lieko VP nedod. ASV trūkst ${P0.mU}${P0.mU?` (PSRS +${P0.mU})`:''}, PSRS trūkst ${P0.mS}${P0.mS?` (ASV +${P0.mS})`:''}. ${P0.to?`Tikai starpība: <b>${SIDE_LV[P0.to]} +${P0.net} VP</b>.`:'<b>Nekas nemainās.</b>'}`); done(ok); };
}

  {k:'gold', min:90,  lv:'Zelta',   rank:'Vēstnieks',          c1:'#fbe7a1', c2:'#d9a836', c3:'#8a6414', note:'Gandrīz nevainojami.'},
  {k:'silv', min:80,  lv:'Sudraba', rank:'Diplomāts',          c1:'#f3f5f6', c2:'#b5bec5', c3:'#6b767f', note:'Droši pārzini noteikumus.'},

   <linearGradient id="${g}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
   <path d="M34 0h22l14 52H48z" fill="#c1272d"/><path d="M64 0h22L72 52H50z" fill="#1d6fae"/>

// ---- tiny fanfare (WebAudio, only after a click)
function fanfare(on){ if(!on) return; try{ const A=new (window.AudioContext||window.webkitAudioContext)(); const t0=A.currentTime+.05;
  [[392,0,.18],[523,.18,.18],[659,.36,.18],[784,.54,.5],[659,1.08,.16],[784,1.24,.9]].forEach(([f,s,d])=>{ for(const mul of [1,2]){ const o=A.createOscillator(), g=A.createGain(); o.type=mul===1?'sawtooth':'triangle'; o.frequency.value=f*mul;
    g.gain.setValueAtTime(0,t0+s); g.gain.linearRampToValueAtTime(mul===1?.07:.03,t0+s+.03); g.gain.exponentialRampToValueAtTime(.0005,t0+s+d); o.connect(g); g.connect(A.destination); o.start(t0+s); o.stop(t0+s+d+.05); } });
  setTimeout(()=>A.close(),3500); }catch(e){} }

function confetti(host){ if(REDUCED()) return; const cols=['#c1272d','#1d6fae','#f3c623','#f5e3cc','#ffffff'];
  for(let i=0;i<70;i++){ const s=h('span',{cls:'cf'}, Math.random()<.5?'★':''); s.style.left=(Math.random()*100)+'%'; s.style.color=cols[i%cols.length]; s.style.background=s.textContent?'transparent':cols[i%cols.length];
    s.style.animationDelay=(Math.random()*.8)+'s'; s.style.animationDuration=(2.4+Math.random()*2)+'s'; s.style.setProperty('--dx',(Math.random()*160-80)+'px'); s.style.setProperty('--rot',(Math.random()*720-360)+'deg'); host.appendChild(s); }
  setTimeout(()=>host.querySelectorAll('.cf').forEach(x=>x.remove()),5200); }

function typeText(el, text, ms, done){ if(REDUCED()){ el.textContent=text; return done&&done(); } let i=0; const tick=()=>{ el.textContent=text.slice(0,++i); if(i<text.length) setTimeout(tick, text[i-1]===' '?ms*1.6:ms); else done&&done(); }; tick(); }

// ---- the ceremony: 4 scenes in a full-screen overlay
function ceremony(sc, onDone){
  const t=tierOf(sc); if(!t) return onDone&&onDone();
  let sound=true;
  const ov=h('div',{cls:'cer',role:'dialog','aria-modal':'true','aria-label':'Diploma ceremonija'});
  const stage=h('div',{cls:'cer-stage'}); const fx=h('div',{cls:'cer-fx'});
  const top=h('div',{cls:'cer-top'}); const snd=h('button',{cls:'cer-x'},'🔊'); snd.onclick=()=>{ sound=!sound; snd.textContent=sound?'🔊':'🔇'; };
  const skip=h('button',{cls:'cer-x'},'Izlaist ✕'); skip.onclick=()=>finish();
  top.append(snd,skip); ov.append(top,stage,fx); document.body.appendChild(ov); document.body.style.overflow='hidden';
  const finish=()=>{ ov.classList.add('out'); setTimeout(()=>{ ov.remove(); document.body.style.overflow=''; onDone&&onDone(); }, REDUCED()?0:400); };
  const scene=(html)=>{ stage.innerHTML=''; const s=h('div',{cls:'cer-scene'},html); stage.appendChild(s); return s; };

  // 1. sealed dossier
  const s1=()=>{ const s=scene(`<div class="dossier"><div class="stamp-ts">TOP SECRET · SLEPENI</div>
      <div class="dos-k">Lieta Nr. 1945-1989</div><h2>Personas lieta</h2>
      <p>Abu lielvaru izlūkdienesti ir izskatījuši tavu gala eksāmenu. Lēmums ir pieņemts un aizzīmogots šajā aploksnē.</p>
      <label class="dos-l">Kā tevi ierakstīt diplomā?</label><input class="dos-in" type="text" maxlength="40" placeholder="Vārds Uzvārds">
      <button class="btn pri dos-go">Atvērt aploksni</button><div class="wax">★</div></div>`);
    const inp=$('.dos-in',s); inp.value=dipName(); setTimeout(()=>inp.focus(),300);
    const go2=()=>{ setDipName(inp.value.trim()); s.querySelector('.dossier').classList.add('open'); setTimeout(s2, REDUCED()?0:650); };
    $('.dos-go',s).onclick=go2; inp.onkeydown=e=>{ if(e.key==='Enter') go2(); }; };

  // 2. telegram + DEFCON rising to peace
  const s2=()=>{ const nm=(dipName()||'Kandidāts').toUpperCase();
    const s=scene(`<div class="telegram"><div class="tg-h"><span>TELEGRAMMA</span><span>VAŠINGTONA ⇄ MASKAVA · KARSTĀ LĪNIJA</span></div><pre class="tg-b"></pre></div>
      <div class="dc" aria-label="DEFCON trase">${[1,2,3,4,5].map(n=>`<div class="dc-c dc${n}">${n===1?'☢':n}</div>`).join('')}</div><div class="dc-l"></div><div class="cer-next"></div>`);
    const txt=`KANDIDĀTS: ${nm}. STOP.\nGALA EKSĀMENS: ${sc}%. STOP.\nNOTEIKUMI APGŪTI. KODOLKARŠ NAV IZCĒLIES. STOP.\nIETEIKUMS: PIEŠĶIRT DIPLOMU. STOP.`;
    typeText($('.tg-b',s), txt, 28, ()=>{ const cells=[...s.querySelectorAll('.dc-c')]; let i=0;
      const up=()=>{ cells.forEach((c,k)=>c.classList.toggle('on',k===i)); $('.dc-l',s).textContent=i===4?'DEFCON 5 · MIERS. Pasaule ir drošībā.':`DEFCON ${i+1}`; if(i<4){ i++; setTimeout(up, REDUCED()?0:420); } else { const b=h('button',{cls:'btn pri'},'Uz ceremoniju →'); b.onclick=s3; $('.cer-next',s).appendChild(b); b.focus(); } };
      up(); }); };

  // 3. drum roll: medals spin, stop on the tier
  const s3=()=>{ const s=scene(`<p class="cer-k">Abu lielvaru kopīgā komisija piešķir</p><div class="reel"></div><div class="cer-tier"></div><div class="cer-next"></div>`);
    const reel=$('.reel',s); const order=[...TIERS].reverse(); const stopAt=order.indexOf(t); const spins=REDUCED()?0:order.length*2+stopAt; let i=0;
    const show=k=>{ reel.innerHTML=`<div class="reel-m">${medalSVG(order[k%order.length],110,'r'+i)}</div><div class="reel-lab">${order[k%order.length].lv}</div>`; };
    const roll=()=>{ show(i); if(i<spins){ i++; setTimeout(roll, 90+i*i*2.2); } else land(); };
    const land=()=>{ reel.classList.add('landed'); reel.innerHTML=`<div class="reel-m big">${medalSVG(t,150,'win')}</div>`; fanfare(sound); confetti(fx);
      $('.cer-tier',s).innerHTML=`<h2 style="color:${t.c2}">${t.lv.toUpperCase()} DIPLOMS</h2><div class="cer-rank">Tituls: <b>${t.rank}</b></div><p>${t.note} Gala eksāmens: <b>${sc}%</b>.</p>`;
      const b=h('button',{cls:'btn pri'},'Saņemt diplomu 🎓'); b.onclick=finish; $('.cer-next',s).appendChild(b); b.focus(); };
    roll(); };

  s1();
}

<title>TS Akadēmija</title></head><body>
<style>/* Layout: rulebook look — red/blue starred header band, cream "example" panels on warm paper, condensed caps headings in rulebook blue. Single light theme on purpose (the printed rulebook look). */
:root{
  --paper:#f7efe4; --panel:#f6e3cc; --panel2:#efe0cb; --ink:#231f1d; --ink2:#5b524b;
  --red:#c1272d; --red-d:#8f1c21; --blue:#1d6fae; --blue-d:#174f7c; --navy:#13304d;
  --gold:#f3c623; --purple:#57549f; --line:#d9c6ad; --ok:#2e7d32; --bad:#c62828; --okbg:#e3f1e2; --badbg:#f9e1df;
  --f-disp:"Bebas Neue","Oswald","Arial Narrow",sans-serif;
  --f-ui:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Crimson Pro","Georgia",serif;
  color-scheme:light;
}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
*{box-sizing:border-box}
button{font-family:var(--f-ui);cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
a{color:var(--blue)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header band */
.band{background:linear-gradient(90deg,var(--red) 0 50%,#1f6f93 50% 100%);color:#fff;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.28) 1px,transparent 1.4px);background-size:6px 6px;mask-image:linear-gradient(to bottom,transparent 30%,#000);pointer-events:none}
.band .wrap{position:relative;z-index:1;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{background:#111;border-radius:8px;padding:2px 10px 0;line-height:.9;font-family:var(--f-disp);font-size:24px;color:#f5e3cc;letter-spacing:.06em}
.logo b{display:block;background:#f5e3cc;color:#111;margin:0 -10px;padding:2px 10px;border-radius:0 0 8px 8px;font-weight:400}
.band .ttl{font-family:var(--f-disp);font-size:22px;letter-spacing:.05em}
.band nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.band nav button{background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px;font-size:16px}
.band nav button[aria-current="true"]{background:#f5e3cc;color:#111}
.stars{color:#f3dfb8;letter-spacing:10px;font-size:14px}

main{padding-block:18px 60px}
.crumb{font-family:var(--f-ui);color:var(--ink2);font-size:16px;margin-bottom:6px}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.hero img{border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.hero h1{font-size:44px;color:var(--blue);line-height:1}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero h1{font-size:36px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 18px;font-size:20px;font-weight:600;letter-spacing:.02em;min-height:44px}
.btn.pri{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.btn.sec{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:16px;background:#e3d3bd;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red))}
.pct{font-family:var(--f-ui);font-size:18px}
.savebadge{font-family:var(--f-ui);font-size:15px;color:var(--ink2)}

/* course map */
.chap{background:var(--panel);border-radius:14px;padding:14px 16px;margin-top:14px}
.chap h2{font-size:28px;color:var(--blue)}
.chap.locked{opacity:.6}
.tlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.titem{display:flex;align-items:center;gap:10px;background:#fbf4ea;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-ui);font-size:19px;text-align:left;width:100%;color:var(--ink)}
.titem .st{flex:0 0 auto;font-size:14px;border-radius:12px;padding:2px 8px;font-weight:600;letter-spacing:.03em}
.st.done{background:var(--okbg);color:var(--ok)}
.st.cur{background:var(--gold);color:#3a2c00}
.st.lock{background:#e0d6c8;color:#7a6e62}
.st.soon{background:#e0d6c8;color:#7a6e62}
.titem.cur{border:2px solid var(--gold)}
.titem[disabled]{cursor:not-allowed;color:#8c8075}
.titem .num{font-family:var(--f-disp);font-size:22px;color:var(--red);min-width:46px}
.titem .best{margin-left:auto;font-size:15px;color:var(--ink2)}

/* lesson */
.lesson h1{font-size:40px;color:var(--blue);line-height:1.05}
.blk{border-radius:12px;padding:14px 16px;margin-top:14px;border-left:8px solid}
.blk h3{font-family:var(--f-ui);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.blk.rule{background:#fbf0c9;border-color:#e2b616}
.blk.ex{background:#e1ecf6;border-color:var(--blue)}
.blk.imp{background:#f8e0dc;border-color:var(--red)}
.blk.sim{background:var(--panel);border-color:#2b2b2b}
.blk.real{background:#f1ebe2;border-color:#7d6d5d}
.blk p{margin:.4em 0}.blk ul{margin:.3em 0;padding-left:1.2em}
.src{font-family:var(--f-ui);font-size:15px;color:var(--ink2);margin-top:6px}
.en{font-family:var(--f-ui);font-style:normal;background:#efe6d8;border-radius:4px;padding:0 4px;white-space:nowrap}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
figure{margin:0;min-width:0}
figure img{border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block;margin:0 auto}
figcaption{font-family:var(--f-ui);font-size:15px;color:var(--ink2);margin-top:4px}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding-block:18px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));margin-top:10px}

/* map view */
.mapv{position:relative;width:100%;overflow:hidden;border-radius:10px;border:2px solid #2c2c2c;background:#7f97a3;touch-action:manipulation}
.mapv img{position:absolute;max-width:none;border:0;border-radius:0;cursor:default;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border:0;background:transparent;padding:0;border-radius:4px}
.hs.on{outline:5px solid var(--gold);outline-offset:3px;background:transparent;box-shadow:0 0 0 3px #222}
.hs.nb{outline:4px solid #29b34a;background:rgba(41,179,74,.25)}
.hs.dim{background:rgba(30,30,30,.45)}
.hs.good{outline:4px solid var(--ok);background:rgba(46,125,50,.3)}
.hs.badc{outline:4px solid var(--bad);background:rgba(198,40,40,.3)}
.hs:hover{outline:3px solid #fff}
.maptools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-family:var(--f-ui);font-size:16px;border:1px solid var(--ink2);background:#fbf4ea;border-radius:16px;padding:4px 12px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.info{background:#fbf4ea;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-family:var(--f-ui);font-size:18px;min-height:52px}

/* country box replica */
.cbox{display:inline-flex;flex-direction:column;width:150px;border-radius:9px;border:4px solid var(--rc,#6a6aa8);background:var(--rb,#cfcde6);overflow:hidden;font-family:var(--f-ui);vertical-align:top;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cbox .nm{display:flex;align-items:stretch;background:#fff;color:#111;font-weight:700;font-size:15px;line-height:1.1}
.cbox .nm span{flex:1;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbox.bg .nm{background:var(--purple);color:#fff}
.cbox .sn{flex:0 0 22px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#111;font-weight:700}
.cbox.bg .sn{background:var(--red);color:#fff}
.cbox .half{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;min-height:58px}
.cbox .slot{background:rgba(255,255,255,.35);border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative}
.cbox .slot::before{content:attr(data-g);font-size:24px;color:rgba(0,0,0,.12)}
.cbox .slot .tok{position:absolute}
.cbox .rg{font-size:12px;padding:0 6px 3px;color:#3d3833}
.tok{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:.9;border:2px solid;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tok i{font-style:normal;font-size:15px}
.tok.us{background:#fff;color:var(--blue);border-color:var(--blue)}
.tok.us.c{background:var(--blue);color:#fff}
.tok.su{background:#fff;color:var(--red);border-color:var(--red)}
.tok.su.c{background:var(--red);color:#fff}
.boxes{display:flex;flex-wrap:wrap;gap:10px}
.boxes .cbox{cursor:pointer}
.boxes .cbox.sel{outline:4px solid var(--gold)}

/* quiz */
.qcard{background:#fbf4ea;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.qhead{display:flex;justify-content:space-between;font-family:var(--f-ui);color:var(--ink2);font-size:16px}
.qtext{font-size:20px;margin:8px 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-body);font-size:18px;color:var(--ink);width:100%}
.opt .k{font-family:var(--f-disp);font-size:22px;color:var(--blue);min-width:20px}
.opt[aria-pressed="true"]{border-color:var(--navy);background:#e6eef6}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.rev{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:17px}
.rev.ok{background:var(--okbg)}.rev.no{background:var(--badbg)}
.tag{font-family:var(--f-ui);font-size:14px;border-radius:10px;padding:1px 8px;background:#e8dccb;color:var(--ink2)}
.tag.rv{background:#dfe9f3;color:var(--blue-d)}
.score{font-family:var(--f-disp);font-size:64px;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}

/* misc */
.tracks{display:grid;gap:4px}
.trk{display:flex;flex-wrap:wrap;gap:3px}
.trk button{min-width:36px;height:36px;border-radius:6px;border:2px solid #333;font-family:var(--f-disp);font-size:20px;background:#eee;color:#111;padding:0 4px}
.trk button.u{background:var(--blue);color:#fff;border-color:var(--blue-d)}
.trk button.s{background:var(--red);color:#fff;border-color:var(--red-d)}
.trk button.on{outline:4px solid var(--gold);transform:scale(1.08)}
.vpbar{overflow-x:auto;padding:6px 2px}
.vpbar .trk{flex-wrap:nowrap}
.lbl{font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.order{display:grid;gap:6px}
.order button{text-align:left}
.sort-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;flex-wrap:wrap}
.sort-item .nm{flex:1 1 180px;font-family:var(--f-ui);font-size:18px}
.res{font-family:var(--f-ui);font-size:18px;margin-top:8px;padding:8px 12px;border-radius:8px}
.res.ok{background:var(--okbg);color:#1d4f20}.res.no{background:var(--badbg);color:#7a1717}
.hot{position:relative;display:inline-block;max-width:100%}
.hot img{display:block;cursor:default}
.hot .hs{outline:2px dashed rgba(29,111,174,.7)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;cursor:zoom-out}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.album figure{background:#fbf4ea;border:1px solid var(--line);border-radius:10px;padding:8px}
.album .n{font-family:var(--f-disp);color:var(--red);font-size:22px}
table.sm{border-collapse:collapse;font-family:var(--f-ui);font-size:17px}
table.sm td,table.sm th{border:1px solid var(--line);padding:3px 8px;text-align:left}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;font-family:var(--f-ui);padding:8px 14px;border-radius:8px;z-index:60}
@media (max-width:520px){body{font-size:17px}.lesson h1{font-size:32px}.band .ttl{display:none}.cbox{width:136px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hs.srcc{outline:4px solid var(--blue);background:rgba(29,111,174,.25)}
#app img{max-width:100%;height:auto}
#app .mapv img{max-width:none!important;height:auto}

.mapv svg.clbl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.kt{border:2px solid #b9a98a;border-left-width:8px;border-radius:8px;background:#fffdf7;padding:8px 12px;margin:8px 0;font-size:.95em}.kt-us{border-left-color:#1d6fae}.kt-ussr{border-left-color:#c62828}.kt-both{border-left-color:#888}.kt-h{font-weight:700;margin-bottom:2px}

/* ===== Design pass: rulebook/card-style section bands with simple line icons */
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.blk{border:2px solid var(--bc);border-left-width:2px;border-radius:12px;padding:0 16px 14px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.blk h3{display:flex;align-items:center;gap:10px;margin:0 -16px 10px;padding:6px 16px 4px;background:var(--bc);color:#fff;font-family:var(--f-disp);font-weight:400;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.blk h3 .badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.75)}
.blk h3 .badge .ico{width:18px;height:18px}
.blk.rule{background:#fbf3d6;--bc:#b98f12}
.blk.ex{background:#e6eff7;--bc:var(--blue)}
.blk.imp{background:#f9e5e1;--bc:var(--red)}
.blk.sim{background:var(--panel);--bc:#2b2b2b}
.blk.real{background:#f3ede4;--bc:#7d6d5d}
.blk.sim h3{background:repeating-linear-gradient(135deg,#2b2b2b 0 14px,#333 14px 28px)}
.kt-h{display:flex;align-items:center;gap:6px}
.mk-ok,.mk-no{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;border-radius:50%;color:#fff;font-style:normal;font-family:var(--f-ui);font-weight:700;font-size:.85em;vertical-align:-.15em;margin-right:2px}
.mk-ok{background:var(--ok)}.mk-ok::before{content:"✓"}
.mk-no{background:var(--bad)}.mk-no::before{content:"✕"}
.ln{display:inline-block;width:26px;height:0;border-top:4px solid #111;vertical-align:middle;margin-right:4px}
.ln.br{border-color:#8a5a2b}.ln.rd{border-top-style:dashed;border-color:#c1272d}
/* interactive question widgets */
.opsbar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-family:var(--f-ui);font-size:18px;margin:4px 0 8px}
.side{font-family:var(--f-disp);letter-spacing:.06em;color:#fff;border-radius:6px;padding:1px 8px;font-size:18px}
.side.us{background:var(--blue)}.side.su{background:var(--red)}
.op{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #555;background:transparent}
.op.on{background:var(--gold);border-color:#8a6d00}
.stepper{display:flex;align-items:center;gap:12px;margin:10px 0}
.stepper .btn{min-width:56px;font-size:28px;padding:4px 14px}
.stepper output{font-family:var(--f-disp);font-size:44px;min-width:60px;text-align:center;color:var(--navy)}
.stepper.sm .btn{min-width:44px;font-size:22px;min-height:40px;padding:2px 10px}.stepper.sm output{font-size:32px;min-width:44px}
.stepper .unit{font-family:var(--f-ui);font-size:18px;color:var(--ink2)}
.dicebox{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-family:var(--f-ui);font-size:18px;text-align:center}
.dicebox .lbl{margin-bottom:4px}
.dicebox.rolling .die{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.qcard{box-shadow:0 2px 0 rgba(0,0,0,.08)}
.qhead{border-bottom:1px dashed var(--line);padding-bottom:6px}
.titem .num .ico{width:22px;height:22px;color:var(--red)}
[hidden]{display:none!important}
.qmodal{position:fixed;inset:0;background:rgba(20,16,12,.72);z-index:40;overflow-y:auto;padding:16px max(12px,env(safe-area-inset-left,0px))}
.qm-in{max-width:980px;margin:0 auto 40px;background:var(--paper)}
.qm-in .qhead{align-items:center}
.hs.miss{outline:4px dashed var(--ok);outline-offset:2px}
.tblw{overflow-x:auto;margin:8px 0}
table.cmp{border-collapse:collapse;width:100%;min-width:420px;font-family:var(--f-ui);font-size:17px}
table.cmp td,table.cmp th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.cmp th{background:rgba(0,0,0,.04)}
.sptrack{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:10px 0}
.sptrack .bx{border:2px solid var(--line);border-radius:8px;padding:4px 2px;text-align:center;font-family:var(--f-ui);font-size:13px;line-height:1.15;min-height:92px;position:relative;background:#fff}
.sptrack .bx b{display:block;font-size:16px}
.sptrack .bx .mk{display:flex;gap:2px;justify-content:center;margin-top:3px;min-height:20px}
.sptrack .bx .mk i{width:18px;height:18px;border-radius:50%;display:inline-block}
.sptrack .bx .mk i.us{background:#1d6fae}.sptrack .bx .mk i.su{background:#c1272d}
.sptrack .bx.tg{border-color:#1d6fae;box-shadow:0 0 0 2px rgba(29,111,174,.25)}
.sptrack .bx .ab{color:#b3402a;font-size:11px}
@media (max-width:640px){.sptrack{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dbar{display:flex;gap:4px;margin:6px 0 10px}.dbx{flex:1;text-align:center;font:700 20px var(--f-ui);padding:8px 0;border-radius:6px;opacity:.45;border:3px solid transparent}.dbx.on{opacity:1;border-color:#111;box-shadow:0 0 0 2px #fff inset}
.trgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:16px 0 30px}
.trcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--panel,#fffaf0);border:2px solid #d8c9a8;border-radius:14px;padding:16px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.trcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.trcard b{font-family:var(--f-ui);font-size:22px;color:var(--blue)}.trcard .tri{font-size:34px;line-height:1}.trcard .trm{font-family:var(--f-ui);font-size:14px;color:var(--ink2)}
.trcard.mix{border-color:var(--gold,#c9a227);background:linear-gradient(135deg,#fff6d8,#fffaf0)}

   <ol><li><b>Kārts teksts ir svarīgāks par noteikumiem.</b> Vienīgais izņēmums: notikums nevar piespiest tevi paturēt vērtēšanas kārti.</li>
   <li><b>Gājienu nevar izlaist.</b> Nevar atteikties izspēlēt kārti un nevar pats izmest kārti no rokas.</li>
   <li><b>Pretinieka notikums notiek.</b> Action fāzē pretinieka kārti drīkst izspēlēt tikai operācijas punktiem, bet tās notikums notiek automātiski. To izpilda pretinieks. (Virsraksta fāzē pretinieka kārti drīkst izvēlēties: tad tās notikumu izpilda pretinieks, sīkāk 4. nodaļā.)</li>
   <li><b>DEFCON 1 zaudē aktīvais spēlētājs.</b> Ja DEFCON nokrīt līdz 1, zaudē spēlētājs, kura kārta tobrīd notiek ${E('Phasing Player')}, neatkarīgi no tā, kura kārts to izraisīja.</li>
   <li><b>Vērtēšanas kārti nedrīkst paturēt.</b> Ja gājiena beigās tev rokā ir vērtēšanas kārts, tu zaudē.</li>
   <li><b>Ietekme ir atklāta.</b> Žetonus jebkurā brīdī drīkst apskatīt. Tos var mainīt kā naudu (piem., "3" pret trim "1").</li></ol>`,
   example: `<p>DEFCON ir 2. ASV kārtā ASV izspēlē PSRS kārti operācijas punktiem. PSRS notikums samazina DEFCON par 1. DEFCON kļūst 1, un <b>zaudē ASV</b>, jo tā bija ASV kārta.</p>`,
   important: `<ul><li>"Aktīvais spēlētājs" ${E('Phasing Player')} ir tas, kura Action kārta notiek. Virsraksta fāzē par aktīvo uzskata tās kārts spēlētāju, kuras notikums notiek.</li>
   <li>Ja notikums liek tev <b>izmest</b> kārti, izmestās kārts notikums nenotiek. Tas attiecas arī uz vērtēšanas kārtīm.</li>
   <li>Žetonu skaits nav ierobežots. Ja pietrūkst, drīkst izmantot monētas vai ko citu.</li></ul>`,
   src: 'RB 5.1, 5.2, 5.4, 5.5 (9.–10. lpp.), 4.5 C piezīme (8. lpp.), 8.1.3 (14. lpp.), 10.1.5, 10.3.1 (16.–17. lpp.), 6.1.5–6.1.6 (11. lpp.)',
   real: [IMG('defcon_track.jpg','DEFCON trase. Kreisajā pusē "Nuclear War" (kodolkarš), labajā 5 "Peace"','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('tokens.jpg','Ietekmes žetoni: gaišā puse ir ietekme, tumšā puse ir kontrole','RB 2.1.7, 5. lpp.')],
   extra: [`<p><b>Vēl viens piemērs.</b> 3. gājiena beigās PSRS rokā ir palikusi Europe Scoring. Fāzē "Check for Held Scoring Card" PSRS uzreiz zaudē.</p>`,
           `<p><b>Notikums piespiež izmest.</b> Kārts Blockade liek ASV izmest kārti ar vērtību 3 vai vairāk. ASV izmet Containment, un Containment notikums <b>nenotiek</b>. (BB 7. lpp.)</p>`] },

 ]},

{ id: 2, title: 'Karte un valstis', topics: [
 { id: '2.1', title: 'Reģioni un apakšreģioni', sim: 'regions',
   rule: `<p>Karte ir sadalīta <b>6 reģionos</b> ${E('Regions')}: Eiropa ${E('Europe')}, Āzija ${E('Asia')}, Centrālamerika ${E('Central America')}, Dienvidamerika ${E('South America')}, Āfrika ${E('Africa')} un Tuvie Austrumi ${E('Middle East')}. Viena reģiona valstīm ir viena krāsa.</p>
   <ul><li><b>Eiropā</b> ir divi apakšreģioni ${E('sub-Regions')}: Rietumeiropa ${E('Western Europe')} (tumši violeta) un Austrumeiropa ${E('Eastern Europe')} (gaiši violeta).</li>
   <li><b>Austrija un Somija</b> ${E('Austria, Finland')} pieder <b>abiem</b> Eiropas apakšreģioniem. Kartē tām ir svītrots rāmis.</li>
   <li><b>Āzijā</b> ir apakšreģions Dienvidaustrumāzija ${E('Southeast Asia')} (svītrots dzeltens rāmis).</li>
   <li>Ja kārts vai noteikums saka "Eiropa" vai "Āzija", tas ietver arī to apakšreģionus.</li></ul>
   <p><b>Neparastie gadījumi:</b> Lībija un Ēģipte ir <b>Tuvajos Austrumos</b>, Kanāda un Turcija ir <b>Eiropā</b> (Rietumeiropā).</p>`,
   example: `<p>Kārts liek "pievienot ietekmi Rietumeiropā". Tu drīksti izvēlēties Kanādu, Turciju vai Austriju, jo tās visas ir Rietumeiropā. Polija neder, jo tā ir tikai Austrumeiropā.</p>`,
   important: `<ul><li>Taizeme ir Dienvidaustrumāzijā, tātad arī Āzijā.</li><li>Apakšreģions nav atsevišķs reģions vērtēšanai. Dienvidaustrumāzija ir daļa no Āzijas.</li><li>Lielvaru lauciņi (ASV un PSRS) nepieder nevienam reģionam.</li></ul>`,
   src: 'RB 2.1.1–2.1.2 (4. lpp.), kartes leģenda',
   real: [IMG('map.jpg','Pilna 20. gadadienas karte (saliekta no RB 6.–7. lpp. sagatavošanas attēla)','RB 6.–7. lpp.'), IMG('map_legend.jpg','Kartes leģenda: līnijas, valsts lodziņš un reģionu krāsas','RB 4. lpp.')],
   extra: [`<p><b>Vēl viens piemērs.</b> Kārts liek kaut ko darīt "Āzijā". Tu drīksti izvēlēties gan Indiju, gan Vjetnamu, jo Dienvidaustrumāzija ir daļa no Āzijas.</p>`, `<p><b>Somija.</b> Somija ir gan Rietumeiropā, gan Austrumeiropā. Tāpēc PSRS var likt sākuma ietekmi Somijā kā daļu no "6 jebkur Austrumeiropā".</p>`] },

 { id: '2.2', title: 'Valstis, stabilitāte, Battleground', sim: 'battlegrounds',
   rule: `<p>Katrs lauciņš ir <b>valsts</b> ${E('country')} vai valstu bloks (piem., Benelux).</p>
   <ul><li>Katrai valstij ir <b>stabilitātes skaitlis</b> ${E('Stability Number')}. Tas ir mazais skaitlis lodziņa augšējā labajā stūrī. Jo lielāks skaitlis, jo grūtāk valsti iegūt.</li>
   <li><b>Battleground valstis</b> ir īpaši svarīgas valstis. Uz šīs kartes tās atpazīst pēc <b>violetas nosaukuma joslas</b> un <b>sarkana</b> stabilitātes lodziņa. Parastām valstīm josla ir balta, lodziņš dzeltens.</li>
   <li>Battleground valstis darbojas kā citas valstis, bet tām ir īpaši noteikumi <b>vērtēšanā</b> un <b>apvērsumos</b> (vēlākās nodaļās).</li></ul>
   <p>Uz kartes ir <b>84 valstis</b>, no tām <b>29</b> ir Battleground.</p>`,
   example: `<p>Japāna ${E('Japan')}: violeta josla, sarkans "4". Tā ir Battleground valsts ar stabilitāti 4. Kanāda ${E('Canada')}: balta josla, dzeltens "4". Tā ir parasta valsts ar stabilitāti 4.</p>`,
   important: `<ul><li>Noteikumu teksts saka, ka Battleground nosaukumi ir "uz violeta" fona. Uz 20. gadadienas kartes to papildina sarkanais stabilitātes lodziņš (leģendā: "Battleground Country").</li><li>Stabilitāte nemainās spēles laikā. Tā ir uzdrukāta.</li></ul>`,
   src: 'RB 2.1.3–2.1.4 (4. lpp.), kartes leģenda (4. lpp.)',
   real: [IMG('map_legend.jpg','Leģenda: UK (parasta valsts) un Japan (Battleground)','RB 4. lpp.'), IMG('asia_box.jpg','Āzijas tabula uz kartes','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')],
   extra: [`<p><b>Eiropas Battleground valstis:</b> Francija, Itālija, Rietumvācija, Austrumvācija un Polija. Visas pārējās Eiropas valstis ir parastas.</p>`, `<p><b>Tuvo Austrumu Battleground valstis:</b> Lībija, Ēģipte, Izraēla, Irāka, Irāna un Saūda Arābija. Sīrija, Libāna, Jordānija un Persijas līča valstis ir parastas.</p>`] },

 { id: '2.3', title: 'Kaimiņi un savienojumi', sim: 'adjacency',
   rule: `<p>Valstis savieno <b>līnijas</b>. Valsts ir <b>kaimiņš</b> ${E('adjacent')} visām valstīm, ar kurām to savieno līnija.</p>
   <ul><li><b>Brūna līnija</b>: savieno valstis viena reģiona iekšienē.</li>
   <li><b>Sarkana raustīta līnija</b>: savieno valstis no dažādiem reģioniem (piem., Francija ↔ Alžīrija).</li>
   <li><b>Melna līnija</b>: savieno valsti ar lielvaras lauciņu.</li></ul>
   <p><b>Lielvaru lauciņi</b>. Uz kartes ir ASV un PSRS lauciņi. Tajos <b>nedrīkst likt ietekmi</b>. Bet notikumiem un pārorientācijas metieniem tie skaitās kā "kontrolētas kaimiņvalstis".</p>
   <ul><li>ASV kaimiņi: Kanāda, Meksika, Kuba, Japāna.</li><li>PSRS kaimiņi: Somija, Polija, Rumānija, Afganistāna, Ziemeļkoreja.</li></ul>`,
   example: `<p>Turcija ir kaimiņš Grieķijai, Bulgārijai, Rumānijai (brūnas līnijas) un Sīrijai (sarkana raustīta līnija, jo Sīrija ir Tuvajos Austrumos).</p>`,
   important: `<ul><li>Kaimiņi nav ģeogrāfija. Dažas valstis robežojas dabā, bet spēlē nav savienotas. Tā nav kartes kļūda.</li><li>Kaimiņš ir tikai tas, ko savieno līnija. "Blakus uz kartes" neskaitās.</li><li>Japānai līnija uz ASV iet ar bultu ārpus kartes labajā malā.</li></ul>`,
   src: 'RB 2.1.5–2.1.6 (4. lpp.), kartes leģenda',
   real: [IMG('map.jpg','Karte: brūnās, sarkanās raustītās un melnās līnijas','RB 6.–7. lpp.'), IMG('ussr_seal.jpg','PSRS lauciņš ar melnajām līnijām','Karte, RB 7. lpp.'), IMG('us_seal.jpg','ASV lauciņš','Karte, RB 6. lpp.')],
   extra: [`<p><b>Vēl viens piemērs.</b> Panama ir kaimiņš Kostarikai (brūna līnija) un Kolumbijai (sarkana raustīta līnija uz Dienvidameriku).</p>`, `<p><b>Kāpēc tas svarīgi?</b> Vēlāk ietekmi drīkstēs likt tikai savās valstīs un to kaimiņos (6. nodaļa). Tāpēc kaimiņi ir jāprot atrast.</p>`] },

 { id: '2.4', title: 'Ietekme un kontrole', sim: 'control',
   rule: `<p><b>Ietekme</b> ${E('Influence')} ir tavi žetoni valstī. ASV žetoni ir zili ar zvaigzni, PSRS žetoni sarkani ar sirpi un āmuru.</p>
   <p>Valsti <b>kontrolē</b> ${E('Control')} tas spēlētājs, kuram izpildās <b>abi</b> nosacījumi:</p>
   <ol><li>tava ietekme ≥ valsts stabilitāte, <b>un</b></li><li>tava ietekme pārsniedz pretinieka ietekmi vismaz par stabilitātes skaitli.</li></ol>
   <p>Citādi valsts ir <b>nekontrolēta</b>. Tas ir līdzīgi aliansei Dune: Imperium. Tur vajag sasniegt noteiktu līmeni un būt priekšā. Šeit "priekšā" nozīmē par vismaz stabilitātes skaitli.</p>
   <p><b>Žetona puses:</b> gaišā puse (balts fons) ir ietekme. Tumšā puse (pilnībā zils vai sarkans fons) rāda, ka valsts ir <b>kontrolēta</b>. Uz kartes valsts lodziņā ir divi lauki: kreisais ASV žetoniem, labais PSRS žetoniem.</p>`,
   example: `<p><b>Izraēla, stabilitāte 4.</b> Lai to kontrolētu, vajag vismaz 4 ietekmi <b>un</b> vismaz par 4 vairāk nekā pretiniekam. ASV 5, PSRS 1: 5 ≥ 4 un 5 − 1 = 4 ≥ 4. ASV kontrolē. ASV 5, PSRS 2: starpība 3 &lt; 4. Neviens nekontrolē.</p>`,
   important: `<ul><li>Abiem spēlētājiem vienlaikus var būt ietekme vienā valstī.</li><li>Ja tev ir vairāki žetoni vienā valstī, lielāko vērtību liek virspusē. Žetonus var mainīt kā naudu.</li><li>Sākuma ietekmes skaitļi ir uzdrukāti valstu apakšējos stūros (zili vai sarkani). Reģiona ietekme ir uzrakstīta zem reģiona tabulas.</li></ul>`,
   src: 'RB 2.1.7–2.1.8 (5. lpp.), 6.1.1, 6.1.5–6.1.6 (10.–11. lpp.)',
   real: [IMG('tokens.jpg','Žetoni: US Influence, US Control, USSR Control, USSR Influence','RB 5. lpp.'), IMG('control_example.jpg','Noteikumu piemērs: ASV kontrolē Turciju un Grieķiju, PSRS kontrolē Sīriju un Libānu. Rumāniju un Bulgāriju nekontrolē neviens','RB 10. lpp.'), IMG('bb_turn1_start.jpg','Oficiālais piemērs 1. gājiena sākumā: Austrumvācijā un Polijā PSRS kontrolē (tumšie žetoni)','BB 3. lpp.')],
   extra: [`<p><b>No noteikumu attēla.</b> Grieķija (stabilitāte 2): ASV 3, PSRS 1. 3 ≥ 2 un 3 − 1 = 2 ≥ 2, tāpēc ASV kontrolē. Bulgārija (3): ASV 3, PSRS 2. Starpība 1, tāpēc neviens nekontrolē. (RB 10. lpp.)</p>`, `<p><b>Libāna, stabilitāte 1.</b> ASV 2, PSRS 3. PSRS: 3 ≥ 1 un 3 − 2 = 1 ≥ 1. PSRS kontrolē, lai gan arī ASV ir 2 ietekme.</p>`] },

 { id: '2.5', title: 'Kārts uzbūve', sim: 'card',
   rule: `<ul><li><b>Operācijas vērtība</b> ${E('Operations value')}: skaitlis zvaigznē augšējā kreisajā stūrī.</li>
   <li><b>Zvaigznes krāsa</b> rāda, kurai pusei pieder notikums: <b>sarkana</b> ir PSRS, <b>zila</b> ir ASV, <b>pelēka</b> ir abām pusēm.</li>
   <li><b>Kavas norāde</b>: augšā rakstīts EARLY WAR, MID WAR vai LATE WAR.</li>
   <li><b>Notikuma nosaukums</b>. Ja aiz tā ir <b>zvaigznīte *</b>, kārti pēc notikuma izspēles <b>liek Trash kavā</b>.</li>
   <li><b>Pasvītrots nosaukums</b> nozīmē ilgstošu efektu. Kārti noliek atklātu blakus laukumam kā atgādinājumu, līdz efekts tiek atcelts vai spēle beidzas.</li>
   <li><b>Notikuma teksts</b> un apakšā <b>kārts numurs</b>.</li>
   <li><b>☢ ikona</b> ${E('DEFCON Warning')} apakšējā labajā stūrī. Šo kārti nepareizā brīdī izspēlējot, var zaudēt spēli (ir 14 tādas kārtis).</li></ul>
   <p><b>Vērtēšanas kārtīm</b> ${E('Scoring cards')} nosaukumā ir "Scoring". Tām nav operācijas vērtības.</p>`,
   example: `<p><b>Alliance for Progress*</b>: zila zvaigzne ar "3", MID WAR, nosaukumā ir zvaigznīte. Tā ir ASV kārts ar vērtību 3 no vidējā kara kavas. Pēc notikuma to liek Trash kavā.</p>`,
   important: `<ul><li><b>Divas kavas izspēlētām kārtīm</b> (kā Dune: Imperium – Uprising): <b>Discard kava</b> ${E('discard pile')} ir izspēlētās un izmestās kārtis; tās vēlāk sajauc atpakaļ. <b>Trash kava</b> ${E('removed from the game')} ir kārtis, kas izņemtas no spēles pavisam; tās nekad neatgriežas.</li><li><b>Izmest kārti</b> (discard) nozīmē likt to <b>Discard kavā</b>, nevis Trash kavā. Izmestā kārts vēlāk var atgriezties spēlē.</li><li>Izmestās kārtis (kas nav Trash kavā) noliek <b>atklātas</b> blakus kavai.</li><li>Kārts ar * iet Trash kavā tikai tad, ja tās <b>notikums</b> notiek. Ja to izspēlē operācijas punktiem un notikums nenotiek, tā iet uz Discard kavu.</li><li>Ilgstošos notikumus var atzīmēt arī ar numurētiem atgādinājuma marķieriem.</li><li>Vērtēšanas kārti izspēlē <b>tikai kā notikumu</b> (vērtēšanu). Operācijas punktus tā nedod, jo zvaigznē nav skaitļa.</li></ul>`,
   src: 'RB 2.2.1–2.2.6 (5. lpp.), 5.2 (9. lpp.), 8.1.3 piezīme (14. lpp.)',
   real: [IMG('card_anatomy.jpg','Kārts paraugs ar apzīmējumiem','RB 5. lpp.'), IMG('card_alliance.jpg','Alliance for Progress*: ASV, Mid War','RB 10. lpp.'), IMG('card_quagmire.jpg','Quagmire*: PSRS, Mid War','RB 10. lpp.'), IMG('card_starwars.jpg','Star Wars*: ASV, Late War, ar ☢ ikonu','RB 10. lpp.')],
   extra: [`<p><b>Star Wars*</b>: zila zvaigzne ar "2", LATE WAR, apakšā labajā stūrī ☢. ASV notikums, vērtība 2, vēlīnā kara kava, viena no 14 bīstamajām kārtīm.</p>`, `<p><b>The China Card</b> ir īpaša kārts. Tā nav kavā, bet sākumā atrodas pie PSRS spēlētāja (11. nodaļa).</p>`] },

 { id: '2.6', title: 'Trases un marķieri', sim: 'tracks',
   rule: `<p>Uz laukuma ir vairākas trases. Uz katras ir savs marķieris:</p>
   <ul><li><b>DEFCON trase</b> ${E('DEFCON Status')}: 5 (miers) līdz 1 (kodolkarš). Viens kopīgs marķieris.</li>
   <li><b>Militāro operāciju trase</b> ${E('Required Military Operations')}: 0–5. Divi marķieri, pa vienam katrai pusei.</li>
   <li><b>Gājienu trase</b> ${E('Turn Record Track')}: 1–10, sadalīta Early War (1–3), Mid War (4–7) un Late War (8–10).</li>
   <li><b>Action kārtu trase</b> ${E('Action Round Track')}: 1–8.</li>
   <li><b>Uzvaras punktu trase</b> ${E('Victory Point Track')}: ASV 20 … 0 … PSRS 20.</li>
   <li><b>Kosmosa sacīkšu trase</b> ${E('Space Race Track')}: Start + 8 lodziņi, divi marķieri (NASA un Interkosmos).</li></ul>
   <p>Citi marķieri: <b>DEFCON ierobežojumu</b> atgādinājumi, kāršu atgādinājumu marķieri (ar kārts numuru) un "2nd Card Played" kosmosā.</p>`,
   example: `<p>Gājienu trasē ir uzrakstīts: Early War: <i>Hand Size 8, 6 Action Rounds</i>. Mid War: <i>Add Mid War cards, Hand Size 9, Start 7 Action Rounds</i>. Late War: <i>Add Late War cards, Final Scoring at end of Turn 10</i>.</p>`,
   important: `<ul><li>Uz kartes ir arī lauki kavai ${E('Current Deck')} un Discard kavai ${E('discard pile')}, kā arī ilgstošo notikumu tabula ${E('Event Reminder')}.</li><li>Katram reģionam uz kartes ir tabula ar vērtēšanas VP (Presence, Domination, Control). Tās mācīsimies 12. nodaļā.</li><li>Kartē ir arī Sequence of Play (gājiena secība) atgādinājums.</li><li>Zem DEFCON trases ir uzrakstīts, kur aizliegti apvērsumi un pārorientācija. Aizliegumi <b>summējas</b>: pie 4 Eiropā; pie 3 Eiropā un Āzijā; pie 2 vēl arī Tuvajos Austrumos.</li></ul>`,
   src: 'RB 2.3 (5. lpp.), 3.4 (6. lpp.), karte RB 6.–7. lpp.',
   real: [IMG('markers.jpg','Marķieru paraugi','RB 5. lpp.'), IMG('defcon_track.jpg','DEFCON trase','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('milops_track.jpg','Militāro operāciju trase: sākumā abi marķieri uz 0','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('turn_track.jpg','Gājienu trase','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('ar_track.jpg','Action kārtu trase','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('space_track.jpg','Kosmosa sacīkšu trase','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('seq_play.jpg','Sequence of Play uz kartes','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')],
   extra: [`<p><b>Action kārtu trasē</b> ir lodziņš 8 un atzīme "Turn 4+" pie 7. No 4. gājiena ir 7 Action kārtas. 8. lodziņš ir paredzēts kosmosa spējai "Space Station" (9. nodaļa).</p>`] },
 ]},

{ id: 3, title: 'Spēles sagatavošana', topics: [
 { id: '3.1', title: 'Kārtis un The China Card', sim: 'setuporder',
   rule: `<ol><li>Puses izvēlas, piemēram, nejauši. Solīšana par pusēm ir izvēles noteikums, to kursā nemācām.</li>
   <li>Sajauc <b>tikai Early War</b> kārtis. Tās veido kavu. Mid War un Late War kārtis noliek malā, tās pievienos 4. un 8. gājienā.</li>
   <li>Izdala katram <b>8 kārtis</b>, sākot ar <b>PSRS</b> spēlētāju.</li>
   <li><b>The China Card</b> noliek <b>atklātu</b> PSRS spēlētāja priekšā. Tā neskaitās rokas kārtīs.</li>
   <li>Spēlētāji drīkst apskatīt savas kārtis <b>pirms</b> sākuma ietekmes likšanas.</li></ol>`,
   example: `<p>Oficiālajā piemērā PSRS rokā ir 8 kārtis plus China Card, kopā 9 lietas. ASV rokā ir 8 kārtis. (BB 2. lpp.)</p>`,

 { id: '4.1', title: '10 gājieni un kara periodi', sim: 'deckflow',
   rule: `<p>Spēlē ir <b>10 gājieni</b> ${E('Turns')}. Gājieni ir sadalīti trīs kara periodos:</p>
   <ul><li><b>Early War</b> ${E('Early War')}: 1.–3. gājiens. Kavā ir tikai Early War kārtis.</li>
   <li><b>Mid War</b> ${E('Mid War')}: 4.–7. gājiens. Mid War kārtis iejauc kavā 3. gājiena beigās, kad gājiena marķieri pārvieto uz 4.</li>
   <li><b>Late War</b> ${E('Late War')}: 8.–10. gājiens. Late War kārtis iejauc kavā 7. gājiena beigās, kad gājiena marķieri pārvieto uz 8.</li></ul>
   <p><b>Kad kava beidzas:</b> vispirms izdala visas kavā atlikušās kārtis. Tikai tad sajauc Discard kavu ${E('discard pile')} un no tās veido jaunu kavu. Kārtis ar zvaigznīti (*), kuru notikums ir noticis, ir Trash kavā. Tās jaunajā kavā neiet.</p>
   <p><b>Kad sākas jauns periods:</b> Discard kavu kavai <b>nepievieno</b>. Jaunās kārtis pievieno <b>esošajai kavai</b> un sajauc. Discard kavas kārtis paliek Discard kavā, līdz kava kādreiz beigsies.</p>`,
   example: `<p>3. gājiena beigās kavā vēl ir 10 kārtis, un Discard kavā ir 20 kārtis. Kad gājiena marķieri pārvieto uz 4, Mid War kārtis sajauc ar <b>tām 10</b> kavas kārtīm. Tās 20 izmestās kārtis paliek malā.</p>`,
   important: `<ul><li>Jaunā perioda kārtis iet <b>kavā</b>, nevis Discard kavā.</li>
   <li>Discard kavu sajauc <b>tikai tad</b>, kad kavā vairs nav kāršu. Pirms tam izdala visas atlikušās kavas kārtis.</li>
   <li>Trash kavas (*) kārtis vairs neatgriežas.</li>
   <li>Mid War kārtis pievieno <b>3. gājiena beigās</b> (kad pārvieto gājiena marķieri, "Advance Turn Marker"), lai 4. gājienā tās jau būtu kavā. Tas ir viens un tas pats brīdis.</li><li>Rokas izmērs: 1.–3. gājienā <b>8 kārtis</b>, no 4. gājiena <b>9 kārtis</b> (The China Card neskaitās). Tas ir uzrakstīts uz gājienu trases.</li><li>Discard kava ir atklāta kava ar izspēlētajām un izmestajām kārtīm.</li></ul>`,
   src: 'RB 4.1, 4.3, 4.4, 4.5 H (8.–9. lpp.), BB 9. lpp.',
   real: [IMG('turn_track.jpg','Gājienu trase: 1–3 Early War, 4–7 Mid War, 8–10 Late War','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('deck.jpg','Kava','RB 7. lpp.')],
   extra: [`<p><b>Oficiālais piemērs.</b> 3. gājiena sākumā kavā nepietiek kāršu. Vispirms izdala visas kavā atlikušās kārtis. Tikai tad sajauc Discard kavu jaunā kavā. (BB 9. lpp.: "The remaining cards in the draw deck are dealt before the discard pile is shuffled to form a new draw deck.")</p>`,
           `<p><b>Zvaigznītes kārts.</b> 1. gājienā ASV izspēlēja Truman Doctrine* kā notikumu. Kārts ir Trash kavā. Kad vēlāk Discard kavu sajauc jaunā kavā, Truman Doctrine tajā nav. (BB 4. lpp.)</p>`] },

 { id: '4.2', title: 'Ko dara katrā fāzē', sim: 'phasewhat',
   rule: `<p>Fāžu secība ir uzdrukāta uz kartes ("Sequence of Play"), tāpēc tā <b>nav jāiekaļ</b>. Svarīgi ir saprast, <b>ko katrā fāzē dara</b>:</p>
   <ul><li><b>Improve DEFCON Status</b>: ja DEFCON ir mazāks par 5, to uzlabo par 1.</li>
   <li><b>Deal Cards</b>: katram papildina roku līdz 8 kārtīm (1.–3. gājiens) vai 9 kārtīm (4.–10. gājiens). The China Card neskaitās.</li>
   <li><b>Headline Phase</b>: abi slepeni izvēlas pa vienai kārtij un atklāj vienlaikus. Abi notikumi notiek obligāti.</li>
   <li><b>Action Rounds</b>: spēles galvenā daļa. Spēlētāji pārmaiņus izspēlē pa vienai kārtij, PSRS sāk. Katru kārti izspēlē kā notikumu vai operācijas punktiem.</li>
   <li><b>Check Military Operations Status</b>: kurš veicis par maz militāro operāciju, tā pretinieks saņem VP. Tad abus marķierus atliek uz 0.</li>
   <li><b>Check for Held Scoring Card</b>: kurš rokā tur vērtēšanas kārti, tas uzreiz zaudē.</li>
   <li><b>Flip The China Card</b>: ja The China Card gājiena laikā tika nodota aizklāta, to apgriež atklātu.</li>
   <li><b>Advance Turn Marker</b>: gājiena marķieri pārvieto uz nākamo gājienu. Pēc 3. gājiena kavā iejauc Mid War kārtis, pēc 7. gājiena Late War kārtis.</li>
   <li><b>Final Scoring</b>: tikai pēc 10. gājiena notiek gala vērtēšana.</li></ul>`,
   example: `<p>1. gājiens oficiālajā piemērā: DEFCON jau ir 5, tāpēc DEFCON uzlabošanā nekas nemainās. Abi saņem 8 kārtis. PSRS virsrakstā izspēlē Red Scare/Purge, ASV izspēlē Special Relationship. Tad katrs izspēlē 6 kārtis Action kārtās. Beigās pārbauda militārās operācijas: abiem pietiek. Abi tur kārtis, kas nav vērtēšanas kārtis, tāpēc neviens nezaudē. (BB 3.–5. lpp.)</p>`,
   extra: [`<p><b>Oficiālais piemērs: no 1. gājiena beigām līdz 2. gājienam.</b> Check Military Operations Status: DEFCON 2, abiem 5 militārās operācijas, soda nav, marķierus atliek uz 0. Check for Held Scoring Card: PSRS rokā Blockade, ASV rokā Containment, vērtēšanas kāršu nav. Flip The China Card: China Card netika izspēlēta, nekas nenotiek. Advance Turn Marker: gājiena marķieris uz 2. 2. gājiena sākumā Improve DEFCON Status: 2 → 3. Deal Cards: katram 7 kārtis, lai rokā būtu 8.</p>`],
   important: `<ul><li>Secību vienmēr vari paskatīties uz kartes. Mācies, <b>kas</b> katrā fāzē notiek.</li><li>Gala vērtēšana notiek <b>tikai</b> pēc 10. gājiena.</li><li>Sīkāk katru fāzi apskatīsim nākamajās tēmās.</li></ul>`,
   src: 'RB 4.5 (8.–9. lpp.), 8.2.1 (14. lpp.)',
   real: [IMG('seq_play.jpg','Gājiena secība ir uzdrukāta uz kartes','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')] },

 { id: '4.3', title: 'DEFCON uzlabošana un kāršu dalīšana', sim: 'deal',
   rule: `<p><b>Improve DEFCON Status.</b> Ja DEFCON ir <b>mazāks par 5</b>, pieskaiti tam 1 (virzienā uz mieru). Ja tas jau ir 5, nekas nenotiek.</p>
   <p><b>Deal Cards.</b> Katram spēlētājam izdala tik kārtis, lai rokā būtu:</p>
   <ul><li><b>8 kārtis</b> 1.–3. gājienā;</li><li><b>9 kārtis</b> 4.–10. gājienā.</li></ul>
   <p><b>The China Card</b> šajā skaitā <b>neskaitās</b>.</p>`,
   example: `<p>2. gājiena sākumā PSRS rokā ir 1 turēta kārts (Blockade) un The China Card. PSRS saņem <b>7</b> kārtis, jo China Card neskaitās: 1 + 7 = 8. ASV rokā ir 1 turēta kārts (Containment), un arī ASV saņem 7. (BB 5.–6. lpp.)</p>`,
   important: `<ul><li>DEFCON uzlabojas tikai par <b>1</b> vienā gājienā šajā fāzē, nevis uzreiz līdz 5.</li>
   <li>Kāršu skaits rokā ir <b>mērķis</b>, nevis cik izdala. Ja rokā jau ir 2 kārtis, 1.–3. gājienā saņem 6.</li>
   <li>Mainās tikai "līdz cik" (8 vai 9). Action kārtu skaits mainās tajā pašā gājienā (6 vai 7).</li></ul>`,
   src: 'RB 4.5 A–B (8. lpp.), BB 5.–6. lpp.',
   real: [IMG('defcon_track.jpg','DEFCON trase: gājiena sākumā marķieri pārvieto par 1 uz labo pusi (5 "Peace")','Pārzīmēts pēc kartes (RB 6.–7. lpp.)'), IMG('china_card.jpg','The China Card neskaitās rokas kāršu skaitā','RB 7. lpp.')],
   extra: [`<p><b>Oficiālais piemērs.</b> 1. gājiena beigās DEFCON ir 2. 2. gājiena sākumā, DEFCON uzlabošanā, tas kļūst <b>3</b>, nevis 5. (BB 6. lpp.: "DEFCON improves from 2 → 3")</p>`,
           `<p><b>4. gājiens.</b> ASV rokā ir 1 turēta kārts. Tagad mērķis ir 9, tāpēc ASV saņem <b>8</b> kārtis.</p>`] },

 { id: '4.4', title: 'Headline fāze', sim: 'headline',
   rule: `<p><b>Headline Phase</b> (virsraksta fāze) ir kā "avīzes virsraksti" gājiena sākumā.</p>
   <ol><li>Katrs spēlētājs <b>slepeni</b> izvēlas vienu kārti no rokas.</li>
   <li>Abi kārtis atklāj <b>vienlaikus</b>.</li>
   <li>Abu kāršu <b>notikumi</b> notiek. Pirmais notiek tas, kuram kārts ir ar <b>lielāku operācijas vērtību</b>.</li>
   <li>Ja vērtības ir <b>vienādas</b>, pirmais ir <b>ASV</b> notikums.</li></ol>
   <ul><li>Vērtēšanas kārti var izspēlēt virsrakstā. Tad tās vērtība ir <b>0</b>. Ja abi izspēlē vērtēšanas kārtis, pirmā ir ASV kārts.</li>
   <li>Virsraksta notikums ir <b>obligāts</b>, arī ja tas palīdz pretiniekam.</li>
   <li><b>The China Card</b> virsrakstā izspēlēt <b>nedrīkst</b>.</li>
   <li>Virsraksta kārtis <b>nedod operācijas punktus</b>, ja vien notikuma teksts to nesaka.</li>
   <li>Ja nosaukumā ir *, kārti pēc notikuma liek Trash kavā.</li></ul>`,
   example: `<p>Oficiālajā piemērā PSRS izvēlas <b>Red Scare/Purge</b> (4), ASV izvēlas <b>Special Relationship</b> (2). 4 ir vairāk nekā 2, tāpēc vispirms notiek Red Scare/Purge, pēc tam Special Relationship. (BB 3. lpp.)</p>`,
   important: `<ul><li>Ja izvēlies <b>pretinieka</b> kārti, notikumu izpilda pretinieks, it kā pats to būtu izspēlējis.</li>
   <li>Taču DEFCON noteikumu nolūkā kārts izspēlētājs skaitās <b>aktīvais spēlētājs</b> ${E('Phasing Player')}. Ja šis notikums nolaiž DEFCON līdz 1, zaudē kārts izspēlētājs.</li>
   <li>Virsrakstā vienmēr izspēlē notikumu. Izvēles "operācijas punktiem" tur nav.</li></ul>`,
   src: 'RB 4.5 C (8. lpp.), 8.1.3 (14. lpp.), BB 3. lpp.',
   real: [IMG('bb_headline.jpg','Oficiālā piemēra virsraksta fāze: Red Scare/Purge (4) notiek pirms Special Relationship (2)','BB 3. lpp.')],
   extra: [`<p><b>Neizšķirts.</b> PSRS virsrakstā ir kārts ar vērtību 3, ASV arī ar vērtību 3. Vērtības ir vienādas, tāpēc <b>vispirms</b> notiek ASV notikums.</p>`,
           `<p><b>Vērtēšana virsrakstā.</b> ASV izspēlē Europe Scoring (vērtība 0), PSRS izspēlē kārti ar vērtību 1. 1 ir vairāk nekā 0, tāpēc vispirms notiek PSRS notikums, un tikai tad vērtē Eiropu.</p>`] },

 { id: '4.5', title: 'Action kārtas', sim: 'rounds',
   rule: `<p>Posmu pēc virsraksta fāzes sauc par <b>Action fāzi</b>. Tajā spēlētāji pārmaiņus veic <b>Action kārtas</b> (Action Rounds). Katrā Action kārtā vispirms PSRS izspēlē vienu kārti, tad ASV izspēlē vienu kārti. Oficiālajā piemērā tās raksta tā: "AR1 (USSR)", "AR1 (US)".</p>
   <ul><li><b>6 Action kārtas</b> 1.–3. gājienā, <b>7</b> 4.–10. gājienā.</li>
   <li>Spēlētāji izspēlē pa <b>vienai kārtij</b>, pārmaiņus. <b>PSRS vienmēr sāk</b>.</li>
   <li>Tas, kura Action kārta notiek, ir <b>aktīvais spēlētājs</b> ${E('Phasing Player')}.</li>
   <li>Visas kārts prasītās darbības jāpabeidz, pirms nākamais spēlētājs izspēlē savu kārti.</li>
   <li>Parasti beigās katram rokā paliek <b>1 kārts</b>. Tā ir <b>turēta</b> ${E('held')} un paliek nākamajam gājienam.</li>
   <li>Ja spēlētājam beidzas kārtis, viņš <b>izlaiž</b> atlikušās Action kārtas. Pretinieks pabeidz gājienu viens pats.</li></ul>`,
   example: `<p>1. gājiens: 8 kārtis − 1 virsrakstam = 7. Tad 6 Action kārtas: 7 − 6 = <b>1 turēta kārts</b>. 4. gājienā: 9 − 1 = 8, tad 7 kārtas: 8 − 7 = <b>1</b>. Oficiālajā piemērā 1. gājiena beigās PSRS tur Blockade, ASV tur Containment. (BB 5. lpp.)</p>`,
   important: `<ul><li>Gājienu <b>nevar izlaist</b> pēc paša vēlēšanās. Kamēr ir kārtis, katrā savā kārtā jāizspēlē kārts.</li>
   <li>Izlaist var tikai tad, ja <b>nav kāršu</b>.</li>
   <li>Ja turētā kārts ir <b>vērtēšanas kārts</b>, gājiena beigās tu zaudē.</li>
   <li>The China Card neskaitās roku izmērā. Kā to izspēlē, mācīsies 11. nodaļā.</li></ul>`,
   src: 'RB 4.2, 4.5 D (8. lpp.), 5.1 (9. lpp.), BB 4.–5. lpp.',
   real: [IMG('bb_actionrounds.jpg','Oficiālā piemēra Action kārtas: PSRS, tad ASV, pārmaiņus','BB 4. lpp.'), IMG('ar_track.jpg','Action kārtu trase','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')],
   extra: [`<p><b>Kāršu pietrūkst.</b> 1. gājienā notikums lika ASV izmest vienu kārti. Tagad pēc 5. Action kārtas ASV rokā nav kāršu. ASV <b>izlaiž</b> 6. kārtu, bet PSRS savu 6. kārtu izspēlē.</p>`,
           `<p><b>Kurš ir aktīvais?</b> PSRS 3. Action kārtā izspēlē Arab-Israeli War. Visu laiku, kamēr šī kārts tiek izpildīta, aktīvais spēlētājs ir PSRS. (BB 4. lpp.)</p>`] },

 { id: '4.6', title: 'Gājiena beigas', sim: 'endturn',
   rule: `<p>Pēc pēdējās Action kārtas notiek gājiena beigu fāzes (secība ir uzdrukāta uz kartes):</p>
   <ul><li><b>Check Military Operations Status:</b> katrs pārbauda, vai veicis pietiekami daudz militāro operāciju. Ja nē, pretinieks saņem VP. Tad abus marķierus atliek uz 0. (Kā tieši rēķina, 10. nodaļā.)</li>
   <li><b>Check for Held Scoring Card:</b> ja kāds rokā tur <b>vērtēšanas kārti</b>, viņš <b>uzreiz zaudē</b>.</li>
   <li><b>Flip The China Card:</b> ja The China Card gājiena laikā tika nodota aizklāta, to tagad apgriež atklātu.</li>
   <li><b>Advance Turn Marker:</b> gājiena marķieri pārvieto uz nākamo gājienu. Pēc 3. gājiena kavā iejauc Mid War kārtis, pēc 7. gājiena Late War kārtis.</li>
   <li><b>Final Scoring:</b> tikai pēc 10. gājiena notiek gala vērtēšana.</li></ul>`,
   example: `<p>Oficiālā piemēra 1. gājiena beigas (BB 5. lpp.): DEFCON ir 2, vajag 2 militārās operācijas. PSRS ir 5, ASV ir 5, abiem pietiek. PSRS tur Blockade, ASV tur Containment. Tās nav vērtēšanas kārtis, tāpēc nekas nenotiek. Rezultāts: PSRS 6 VP.</p>`,
   important: `<ul><li>Militāro operāciju pārbaude notiek <b>pirms</b> turētās vērtēšanas kārts pārbaudes.</li>
   <li>Pēc militāro operāciju pārbaudes militāro operāciju marķieri vienmēr ir uz 0.</li>
   <li>Notikums nevar piespiest tevi paturēt vērtēšanas kārti.</li>
   <li>Gala vērtēšana (Final Scoring) notiek tikai vienreiz spēlē: pēc 10. gājiena.</li></ul>`,
   src: 'RB 4.5 E–I (8.–9. lpp.), 10.1.5 (16. lpp.), BB 5. lpp.',
   real: [IMG('bb_endturn1.jpg','Oficiālā piemēra 1. gājiena beigas: militārās operācijas, turētās kārtis, rezultāts','BB 5. lpp.'), IMG('milops_track.jpg','Militāro operāciju trase: gājiena beigās abus marķierus atliek uz 0','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')],
   extra: [`<p><b>7. gājiena beigas.</b> Kad gājiena marķieri pārvieto uz 8, Late War kārtis iejauc kavā. Tās būs kavā jau 8. gājiena kāršu dalīšanā.</p>`,
           `<p><b>2. gājiena beigas oficiālajā piemērā.</b> PSRS tur Nasser, ASV netur neko. Rezultāts: PSRS 8 VP. (BB 9. lpp.)</p>`] },
 ]},

{ id: 5, title: 'Kāršu izspēle un notikumi', topics: [
 { id: '5.1', title: 'Notikums vai operācijas', sim: 'evops',
   rule: `<p>Katru kārti izspēlē <b>kā notikumu</b> ${E('Event')} vai <b>kā operācijas punktus</b> ${E('Operations')}. Ko drīkst, atkarīgs no kārts puses:</p>
   <ul><li><b>Tavas puses kārts</b> (tavas krāsas zvaigzne): drīksti izvēlēties notikumu <b>vai</b> operācijas punktus.</li>
   <li><b>Abu pušu kārts</b> ${E('Neutral')}: tāpat drīksti izvēlēties notikumu <b>vai</b> operācijas punktus.</li>
   <li><b>Pretinieka kārts</b> Action fāzē: tikai operācijas punktiem. Taču tās notikums <b>notiek automātiski</b>. (Virsraksta fāzē pretinieka kārti drīkst izvēlēties, un tās notikumu izpilda pretinieks.)</li></ul>
   <p>Operācijas punktus visus iztērē <b>vienam</b> darbam: ietekmei, pārorientācijai, apvērsumam vai kosmosa sacīkstēm.</p>
   <p>Gājienu nevar izlaist, atsakoties izspēlēt kārti vai pašam izmetot kārti.</p>`,
   example: `<p>Oficiālajā piemērā ASV 4. Action kārtā izspēlē <b>Europe Scoring</b>. Tā ir abu pušu kārts ${E('Neutral Event')}, tāpēc to drīkst izspēlēt arī ASV. ASV 6. kārtā izspēlē <b>Nuclear Test Ban</b> (abu pušu kārts) operācijas punktiem apvērsumam. (BB 5. lpp.)</p>`,
   important: `<ul><li>Kad izspēlē <b>savu</b> vai <b>abu pušu</b> kārti operācijas punktiem, tās notikums <b>nenotiek</b>.</li>
   <li>Kad izspēlē kārti kā notikumu, tā nedod operācijas punktus, ja teksts to nesaka.</li>
   <li>Vērtēšanas kārtīm nav operācijas vērtības. Tās izspēlē kā notikumu.</li>
   <li>Kārts teksts ir svarīgāks par noteikumiem. Izņēmums: notikums nevar piespiest paturēt vērtēšanas kārti.</li></ul>`,
   src: 'RB 2.2.1 (5. lpp.), 5.1, 5.5 (9.–10. lpp.), 6.0 (10. lpp.), 7.1 (13. lpp.), 10.1.5, BB 5. lpp.',
   real: [IMG('bb_europescoring.jpg','ASV izspēlē Europe Scoring: "Neutral Event"','BB 5. lpp.'), IMG('bb_testban.jpg','Nuclear Test Ban (abu pušu kārts, 4) izspēlēta operācijas punktiem','BB 5. lpp.')],
   extra: [`<p><b>Sava kārts operācijas punktiem.</b> PSRS 2. kārtā izspēlē Suez Crisis (PSRS kārts, 3) operācijas punktiem un liek ietekmi Sīrijā, Irākā un Pakistānā. Suez Crisis notikums nenotiek. (BB 4. lpp.)</p>`,
           `<p><b>Sava kārts kā notikums.</b> ASV 3. kārtā izspēlē Truman Doctrine (ASV kārts) kā notikumu. Tā noņem visu PSRS ietekmi Rumānijā. (BB 4. lpp.)</p>`] },

 { id: '5.2', title: 'Pretinieka notikumi', sim: 'oppevent',
   rule: `<p>Ja izspēlē <b>pretinieka</b> kārti operācijas punktiem, tās notikums <b>tik un tā notiek</b>.</p>
   <ul><li>Notikumu izpilda <b>pretinieks</b>, it kā viņš pats būtu izspēlējis kārti.</li>
   <li><b>Tu</b> kā aktīvais spēlētājs izvēlies, vai notikums notiek <b>pirms</b> vai <b>pēc</b> tavām operācijām.</li>
   <li>Ja notikumam ir <b>priekšnoteikums</b>, kas nav izpildīts, notikums <b>nenotiek</b>.</li>
   <li>Ja cits notikums šo notikumu <b>aizliedz vai atceļ</b>, tas nenotiek. Šo kārti vairs var izspēlēt tikai operācijas punktiem.</li>
   <li>Kārti ar * liek Trash kavā <b>tikai tad, ja notikums notika</b>. Ja nenotika, kārts iet uz Discard kavu.</li>
   <li>Ja notikums notika, bet <b>neko nemainīja</b>, tas tik un tā skaitās noticis. Kārti ar * izņem.</li></ul>`,
   example: `<p><b>Noteikumu grāmatas 1. piemērs.</b> PSRS izspēlē <b>NATO*</b> (ASV kārts) operācijas punktiem, pirms ir izspēlēts Marshall Plan vai Warsaw Pact Formed. PSRS saņem 4 operācijas punktus. NATO notikums nenotiek, jo priekšnoteikums nav izpildīts. Kārts iet uz Discard kavu, <b>nevis</b> tiek izņemta.</p>`,
   important: `<ul><li>"Notika, bet bez efekta" un "nenotika" nav viens un tas pats. Tas nosaka, vai * kārti liek Trash kavā.</li>
   <li>Kad izspēlē <b>savu</b> kārti operācijas punktiem, tās notikums nenotiek. Automātiski notiek tikai <b>pretinieka</b> notikumi.</li>
   <li>Atcelto notikumu kārti joprojām drīkst izspēlēt operācijas punktiem.</li><li><b>Noteikumu grāmatas 2. piemērs.</b> ASV iepriekš izspēlēja Camp David Accords, kas aizliedz Arab-Israeli War notikumu. Tagad ASV izspēlē Arab-Israeli War (2) operācijas punktiem. ASV saņem 2 operācijas punktus, bet notikums nenotiek. Kārti joprojām drīkst izspēlēt operācijas punktiem.</li><li><b>Noteikumu grāmatas 3. piemērs.</b> PSRS izspēlē Alliance for Progress* (ASV kārts). Notikums notiek, pat ja ASV iegūst 0 VP. Tas skaitās noticis, tāpēc kārti liek Trash kavā.</li><li><b>Noteikumu grāmatas 4. piemērs.</b> PSRS izspēlē Star Wars* operācijas punktiem, bet ASV kosmosa sacīkstēs atpaliek. Notikuma nosacījums nav izpildīts, tas nenotiek, un kārts iet uz Discard kavu.</li></ul>`,
   src: 'RB 5.2 un piemēri 1–4 (9.–10. lpp.), 7.5 (14. lpp.)',
   real: [IMG('card_alliance.jpg','Alliance for Progress*: RB 3. piemērā tā "notika", tāpēc ir Trash kavā','RB 10. lpp.'), IMG('card_starwars.jpg','Star Wars*: RB 4. piemērā tā nenotika, tāpēc ir izmesta','RB 10. lpp.')],
   extra: [`<p><b>Noteikumu grāmatas 2. piemērs.</b> ASV izspēlē Arab-Israeli War (PSRS kārts) operācijas punktiem. Iepriekšējā kārtā ASV izspēlēja Camp David Accords, kas aizliedz Arab-Israeli War notikumu. ASV saņem 2 operācijas punktus, bet notikums nenotiek.</p>`,
           `<p><b>Noteikumu grāmatas 3. piemērs.</b> PSRS izspēlē Alliance for Progress* (ASV kārts). ASV nekontrolē nevienu Battleground valsti Dienvidamerikā vai Centrālamerikā, tāpēc VP netiek. Tomēr notikums skaitās <b>noticis</b>, un kārti liek Trash kavā.</p>`,
           `<p><b>Noteikumu grāmatas 4. piemērs.</b> PSRS izspēlē Star Wars* (ASV kārts) operācijas punktiem. ASV kosmosa sacīkstēs atpaliek, tāpēc notikums nevar notikt. Nekas nenotiek, un Star Wars tiek izmesta.</p>`] },

 { id: '5.3', title: 'Zvaigznītes, ilgstošie notikumi, vērtēšanas kārtis', sim: 'cardfate',
   rule: `<p>Kur nonāk kārts pēc izspēles?</p>
   <ul><li><b>Parasti</b>: Discard kavā ${E('discard pile')}.</li>
   <li><b>Nosaukums ar *</b>: ja notikums notika, kārti <b>liek Trash kavā</b> ${E('removed')}.</li>
   <li><b>Pasvītrots nosaukums</b> ${E('Lasting Event')}: efekts ilgst līdz spēles beigām vai līdz atcelšanai. Kārti (vai tās marķieri) noliek <b>blakus kartei</b> kā atgādinājumu.</li>
   <li><b>Vērtēšanas kārtis</b> pēc vērtēšanas iet uz Discard kavu. Vienīgais izņēmums ir <b>Southeast Asia Scoring*</b>: tā ir vienīgā vērtēšanas kārts, ko liek Trash kavā.</li></ul>
   <p><b>Citi noteikumi par kārtīm:</b></p>
   <ul><li>Ja notikums prasa izspēlēt vai izmest kārti ar noteiktu vērtību, <b>lielāka</b> vērtība arī der.</li>
   <li>Ja notikums liek <b>izmest</b> kārti, izmestās kārts notikums <b>nenotiek</b>. Arī vērtēšanas kārtīm.</li>
   <li>Kārts teksts ir svarīgāks par noteikumiem. Izņēmums: notikums nevar piespiest paturēt vērtēšanas kārti.</li></ul>`,
   example: `<p>PSRS 5. kārtā izspēlē <b>COMECON*</b> kā notikumu un pievieno ietekmi četrās Austrumeiropas valstīs. Kārtij ir *, tāpēc to liek Trash kavā. ASV 4. kārtā izspēlē <b>Europe Scoring</b>. Pēc vērtēšanas kārts iet uz Discard kavu un vēlāk var atgriezties kavā. (BB 5. lpp.)</p>`,
   important: `<ul><li>* izņem tikai tad, ja notikums <b>notika</b>. Ja kārti izspēlē sev operācijas punktiem, kārts iet uz Discard kavu.</li>
   <li>Vērtēšanas kārtis (izņemot Southeast Asia) atgriežas kavā, kad Discard kavu sajauc.</li>
   <li>Quagmire prasa izmest kārti ar vērtību 2 vai vairāk. Kārts ar vērtību 3 der (RB 10. lpp.).</li></ul>`,

// ===== Rules engine for Operations (RB 6.1 influence, 6.2 realignment, 8.1.5 DEFCON limits)
const SUPN = {US:'USA', USSR:'USSR'};
const SIDE_LV = {US:'ASV', USSR:'PSRS'};
const OTHER = s => s==='US'?'USSR':'US';
const sIx = s => s==='US'?0:1;
const iv = (inf,n) => inf[n]||[0,0];
const cloneInf = inf => JSON.parse(JSON.stringify(inf||{}));
const EUR_R=['WE','EE','EWE'], ASIA_R=['AS','SEA'];

// Where may `side` place influence? `start` = influence at the start of the action round.
function canPlace(side, start, n){
  const i=sIx(side);
  if(iv(start,n)[i]>0) return {ok:true, why:`${SIDE_LV[side]} ietekme šeit bija jau Action kārtas sākumā.`};
  const nb=C[n].adj.find(a=>C[a] && iv(start,a)[i]>0);
  if(nb) return {ok:true, why:`Blakus valstij ${nmPlain(nb)}, kur ${SIDE_LV[side]} ietekme bija Action kārtas sākumā.`};
  if(C[n].adj.includes(SUPN[side])) return {ok:true, why:`Valsts ir blakus ${side==='US'?'ASV':'PSRS'} lielvaras laukumam.`};
  return {ok:false, why:`Action kārtas sākumā ${SIDE_LV[side]} ietekmes nebija ne šeit, ne kaimiņvalstīs, un valsts nav blakus ${side==='US'?'ASV':'PSRS'} lielvaras laukumam.`};
}
function placeCost(side, inf, n){ const c=ctrlOf(n,...iv(inf,n)); return (c && c!==side) ? 2 : 1; }
// Apply a list of placements in order; returns {inf, spent, steps:[{n,cost,legal,why,ctrl}]}
function applyPlacements(side, start, list){
  const inf=cloneInf(start); let spent=0; const steps=[];
  for(const n of list){ const lg=canPlace(side,start,n), cost=placeCost(side,inf,n);
    const v=iv(inf,n).slice(); v[sIx(side)]++; inf[n]=v; spent+=cost;
    steps.push({n,cost,legal:lg.ok,why:lg.why,ctrl:ctrlOf(n,...v)}); }
  return {inf,spent,steps};
}
// Realignment
function realignBan(defcon, n){ const r=C[n].r;
  if(defcon<=4 && EUR_R.includes(r)) return 'Eiropā';
  if(defcon<=3 && ASIA_R.includes(r)) return 'Āzijā';
  if(defcon<=2 && r==='ME') return 'Tuvajos Austrumos';
  return ''; }
function canRealign(side, inf, n, defcon=5){
  const opp=iv(inf,n)[sIx(OTHER(side))];
  const ban=realignBan(defcon,n);
  if(ban) return {ok:false, why:`DEFCON ${defcon}: pārorientācija ${ban} nav atļauta.`};
  if(!opp) return {ok:false, why:`Šajā valstī nav ${SIDE_LV[OTHER(side)]} ietekmes, ko noņemt.`};
  return {ok:true, why:`Šajā valstī ir ${SIDE_LV[OTHER(side)]} ietekme (${opp}).`};
}
function realignMods(side, inf, n){
  const i=sIx(side), v=iv(inf,n), out=[];
  const adj=C[n].adj.filter(a=>C[a] && ctrlOf(a,...iv(inf,a))===side);
  for(const a of adj) out.push([1,`kontrolē kaimiņvalsti ${nmPlain(a)}`]);
  if(v[i]>v[1-i]) out.push([1,'mērķa valstī ir vairāk ietekmes nekā pretiniekam']);
  if(C[n].adj.includes(SUPN[side])) out.push([1,'mērķis ir blakus savai lielvarai']);
  return out;
}
const modSum = m => m.reduce((a,x)=>a+x[0],0);
function realignResult(inf, n, rollUS, rollSU){
  const mU=modSum(realignMods('US',inf,n)), mS=modSum(realignMods('USSR',inf,n));
  const tU=rollUS+mU, tS=rollSU+mS, d=Math.abs(tU-tS);
  const out=cloneInf(inf); let loser=null, removed=0;
  if(tU>tS){ loser='USSR'; } else if(tS>tU){ loser='US'; }
  if(loser){ const v=iv(out,n).slice(); const k=sIx(loser); removed=Math.min(d,v[k]); v[k]-=removed; out[n]=v; }
  return {mU,mS,tU,tS,d,loser,removed,inf:out};
}

// ---- small visual helpers
function dieSVG(v, side, size=56){
  const pip={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[3,1],[1,3],[3,3]],5:[[1,1],[3,1],[2,2],[1,3],[3,3]],6:[[1,1],[3,1],[1,2],[3,2],[1,3],[3,3]]}[v]||[];
  const bg=side==='US'?'#1d6fae':'#c1272d';
  return `<svg class="die" width="${size}" height="${size}" viewBox="0 0 40 40" role="img" aria-label="Kauliņš: ${v}"><rect x="2" y="2" width="36" height="36" rx="7" fill="${bg}" stroke="#1b1b1b" stroke-width="1.5"/>${pip.map(([x,y])=>`<circle cx="${x*10}" cy="${y*10}" r="3.6" fill="#fff"/>`).join('')}</svg>`;
}
function infList(inf, names){ return names.map(n=>{ const [u,s]=iv(inf,n); const c=ctrlOf(n,u,s); return `<b>${nmPlain(n)}</b> ${u}/${s}${c?` (${SIDE_LV[c]} kontrole)`:''}`; }).join(' · '); }

// ===== Coup (RB 6.3, 8.1.4, 8.1.5, 8.2.2, 8.2.3)
function canCoup(side, inf, n, defcon=5, free=false){
  if(!C[n]) return {ok:false, why:'Lielvaras laukumā apvērsumu veikt nevar.'};
  const ban = free ? '' : realignBan(defcon,n);
  if(ban) return {ok:false, why:`DEFCON ${defcon}: apvērsums ${ban} nav atļauts.`};
  const opp=iv(inf,n)[sIx(OTHER(side))];
  if(!opp) return {ok:false, why:`Šajā valstī nav ${SIDE_LV[OTHER(side)]} ietekmes.`};
  return {ok:true, why:`Šajā valstī ir ${SIDE_LV[OTHER(side)]} ietekme (${opp}).${free&&realignBan(defcon,n)?' Bezmaksas apvērsums drīkst neievērot DEFCON reģionu aizliegumu.':''}`};
}
// Result of a coup: need = 2×stability, tot = roll + ops, d = tot − need.
function coupResult(side, inf, n, ops, roll){
  const s=C[n].s, need=2*s, tot=roll+ops, d=tot-need, out=cloneInf(inf); let removed=0, added=0;
  if(d>0){ const v=iv(out,n).slice(), o=sIx(OTHER(side)); removed=Math.min(d,v[o]); v[o]-=removed; added=d-removed; v[sIx(side)]+=added; out[n]=v; }
  return {s,need,tot,d,ok:d>0,removed,added,inf:out};
}
// DEFCON and military operations after a coup attempt (success or not).
function coupAfter(n, defcon, milops, ops, free=false){
  const nd = C[n].bg ? defcon-1 : defcon;
  return {defcon:nd, milops: free ? milops : Math.min(5, milops+ops), lose: nd<=1};
}

// ===== Space Race (RB 6.4, track on the map, RB 12. lpp.)
const SPACE = [
  {n:'Start'},
  {n:'Earth Satellite', ops:2, roll:3, vp:[2,1]},
  {n:'Animal in Space', ops:2, roll:4, ab:'drīkst spēlēt 2 kosmosa sacīkšu kārtis gājienā'},
  {n:'Man in Space', ops:2, roll:3, vp:[2,0]},
  {n:'Man in Earth Orbit', ops:2, roll:4, ab:'pretinieks izvēlas un atklāj virsraksta kārti pirmais'},
  {n:'Lunar Orbit', ops:3, roll:3, vp:[3,1]},
  {n:'Eagle/Bear Has Landed', ops:3, roll:4, ab:'gājiena beigās drīkst izmest 1 turētu kārti'},
  {n:'Space Shuttle', ops:3, roll:3, vp:[4,2]},
  {n:'Space Station', ops:4, roll:2, vp:[2,0], ab:'drīkst veikt 8 Action kārtas gājienā'},
];
// Attempt from box `cur` (0..7) with a card of `ops`, die `roll`.
function spaceTry(cur, ops, roll){
  if(cur>=8) return {ok:false, why:'Marķieris jau ir pēdējā lodziņā. Kosmosa sacīkstēs vairs nevar spēlēt kārtis.'};
  const t=SPACE[cur+1];
  if(ops<t.ops) return {ok:false, why:`Lodziņam ${cur+1} (${t.n}) vajag kārti ar vismaz ${t.ops} operācijas punktiem.`};
  const adv = roll>=1 && roll<=t.roll;
  return {ok:true, adv, box: adv?cur+1:cur, need:t.ops, range:`1–${t.roll}`};
}
// VP for reaching box b; `first` = this player is first to reach it.
const spaceVP = (b, first) => SPACE[b].vp ? SPACE[b].vp[first?0:1] : 0;

// ===== DEFCON (RB 8.1) and Required Military Operations (RB 8.2)
// Move DEFCON by delta (+ improve, − degrade). Max 5; 1 = nuclear war, the Phasing Player loses.
function defconChange(d, delta){ const raw=d+delta, nd=Math.max(1,Math.min(5,raw)); return {defcon:nd, capped:raw>5, lose:nd<=1}; }
// Improve DEFCON Status phase at the start of a turn.
const defconPhase = d => d<5 ? d+1 : 5;
const milAdd = (m, x) => Math.min(5, m + x);
// End-of-turn check: need = DEFCON. mU/mS = missing points; the opponent gains 1 VP per missing point; only the net goes on the VP track.
function milPenalty(defcon, us, su){ const mU=Math.max(0,defcon-us), mS=Math.max(0,defcon-su), net=mU-mS;
  return {need:defcon, mU, mS, net:Math.abs(net), to: net>0?'USSR':(net<0?'US':null)}; }

// ===== War Events (RB 7.6, 8.2). Indo-Pakistani War card text (RB 14. lpp.):
// roll − 1 per opponent-Controlled country adjacent to the target; victory on 4–6; +2 Military Ops; victory: +2 VP, replace all opponent Influence in target with own.
function warMods(side, inf, target){ return C[target].adj.filter(a=>C[a] && ctrlOf(a,...iv(inf,a))===OTHER(side)); }
function warResult(side, inf, target, roll, o={win:4, vp:2, mil:2}){
  const mods=warMods(side,inf,target), tot=roll-mods.length, ok=tot>=o.win, out=cloneInf(inf); let moved=0;
  if(ok){ const v=iv(out,target).slice(), i=sIx(side); moved=v[1-i]; v[i]+=moved; v[1-i]=0; out[target]=v; }
  return {mods, tot, ok, vp: ok?o.vp:0, mil:o.mil, moved, inf:out};
}

// ===== Regional scoring (RB 10.1; values printed on the map region tables)
const RSC = {EU:{n:'Eiropa', rs:EUR_R, p:3, d:7, c:'auto'}, AS:{n:'Āzija', rs:ASIA_R, p:3, d:7, c:9}, ME:{n:'Tuvie Austrumi', rs:['ME'], p:3, d:5, c:7},
  CA:{n:'Centrālamerika', rs:['CA'], p:1, d:3, c:5}, SA:{n:'Dienvidamerika', rs:['SA'], p:2, d:5, c:6}, AF:{n:'Āfrika', rs:['AF'], p:1, d:4, c:6}};
const inRegion = (reg, n) => !!C[n] && RSC[reg].rs.includes(C[n].r);
const regionCountries = reg => Object.keys(C).filter(n=>inRegion(reg,n));
// One side's controlled countries etc. in a region
function regionStat(reg, inf, side){ const all=regionCountries(reg), ctl=all.filter(n=>ctrlOf(n,...iv(inf,n))===side);
  return {all, ctl, bg:ctl.filter(n=>C[n].bg), nonbg:ctl.filter(n=>!C[n].bg), adj:ctl.filter(n=>C[n].adj.includes(side==='US'?'USSR':'USA')), bgAll:all.filter(n=>C[n].bg)}; }
// Level: 'control' | 'domination' | 'presence' | null
function regionLevel(reg, inf, side){ const a=regionStat(reg,inf,side), b=regionStat(reg,inf,OTHER(side));
  if(a.ctl.length>b.ctl.length && a.bg.length===a.bgAll.length) return 'control';
  if(a.ctl.length>b.ctl.length && a.bg.length>b.bg.length && a.nonbg.length>=1) return 'domination';
  if(a.ctl.length>=1) return 'presence';
  return null; }
function scoreSide(reg, inf, side){ const R=RSC[reg], s=regionStat(reg,inf,side), lv=regionLevel(reg,inf,side);
  const base = lv==='control'?R.c : lv==='domination'?R.d : lv==='presence'?R.p : 0;
  return {lv, base, bg:s.bg.length, adj:s.adj.length, auto: base==='auto', vp: base==='auto'?null : base+s.bg.length+s.adj.length, st:s}; }
function scoreRegion(reg, inf){ const U=scoreSide(reg,inf,'US'), S=scoreSide(reg,inf,'USSR');
  if(U.auto||S.auto) return {US:U, USSR:S, auto:U.auto?'US':'USSR'};
  const d=U.vp-S.vp; return {US:U, USSR:S, net:Math.abs(d), to:d>0?'US':(d<0?'USSR':null)}; }
const LVL_LV = {control:'Kontrole (Control)', domination:'Dominēšana (Domination)', presence:'Klātbūtne (Presence)'};
// VP track: + is USSR side, − is US side; returns new position. ±20 = automatic victory.
const vpMove = (pos, side, n) => pos + (side==='USSR'?n:-n);
const vpTxt = p => p===0?'0 (Start)':(p>0?`PSRS ${p}`:`ASV ${-p}`);

// ===== Chapters 6–7 (Latvian). Sources: RB 6.0–6.2 (10.–11. lpp.), 8.1.5 (13. lpp.); BB 4., 7., 10. lpp.
const BOX = (...n) => { let [x,y,w,hh]=bboxAround(n, 120); const R=1.7; if(w/hh<R){ const nw=Math.min(MAPW,hh*R); x=Math.max(0,Math.min(MAPW-nw,x-(nw-w)/2)); w=nw; } return [x,y,w,hh]; };
const NOTE_ALL = 'Kartē redzama visa ietekme. Citur kartē ietekmes nav.';
const ARS = 'Action kārtas sākums.';
// RB 10. lpp. illustration (control example) — values read from the picture
const RB_TURKEY = {'Romania':[1,3],'Bulgaria':[3,2],'Turkey':[2,0],'Greece':[3,1],'Lebanon':[2,3],'Syria':[0,2]};

{ id: 8, title: 'Operācijas III: apvērsumi', topics: [
 { id: '8.1', title: 'Apvērsuma aprēķins', sim: 'coupcalc',
   rule: `<p><b>Apvērsums</b> ${E('Coup')} ir trešais veids, kā izmantot operācijas punktus. Tas maina valsts ietekmi.</p>
   <ul><li>Mērķa valstī jābūt <b>pretinieka ietekmei</b>. Tev pašam ietekme mērķa valstī vai kaimiņvalstīs <b>nav vajadzīga</b>.</li>
   <li>Viena kārts dod <b>vienu</b> apvērsuma mēģinājumu. Visi kārts operācijas punkti iet šim mēģinājumam.</li></ul>
   <p><b>Aprēķins:</b></p>
   <ol><li>Valsts <b>stabilitātes skaitli</b> ${E('Stability Number')} reizini ar 2.</li>
   <li>Met kauliņu un pieskaiti kārts <b>operācijas punktus</b>.</li>
   <li>Ja rezultāts ir <b>lielāks</b> par divkāršo stabilitāti, apvērsums izdodas. Ja tas ir vienāds vai mazāks, apvērsums neizdodas, un ietekme nemainās.</li>
   <li>Ja izdodas, aprēķini <b>starpību</b> (rezultāts mīnus divkāršā stabilitāte). Tik daudz pretinieka ietekmes noņem. Ja pretinieka ietekmes ir mazāk, trūkstošo daļu <b>pieliec savu</b> ietekmi.</li></ol>
   <p><b>Militārās operācijas.</b> Pēc apvērsuma savu militāro operāciju marķieri pārvieto uz priekšu par kārts operācijas vērtību. Tas notiek arī tad, ja apvērsums neizdodas. Marķieris nevar būt augstāk par 5.</p>`,
   example: `<p><b>Noteikumu grāmatas piemērs.</b> ASV izspēlē kārti ar <b>3</b> operācijas punktiem apvērsumam <b>Meksikā</b>. Meksikas stabilitāte ir 2. ASV tur nav ietekmes, PSRS tur ir 2.</p>
   <ul><li>ASV militāro operāciju marķieri pārvieto par 3.</li>
   <li>Metiens 4 + 3 = <b>7</b>. Divkāršā stabilitāte: 2 × 2 = <b>4</b>. 7 ir lielāks par 4, tātad apvērsums izdodas.</li>
   <li>Starpība: 7 − 4 = <b>3</b>. ASV noņem abus PSRS marķierus (2) un pieliek 1 savu. Meksikā tagad ir ASV 1, PSRS 0.</li></ul>`,
   important: `<ul><li>Apvērsuma metienam <b>nav modifikatoru</b> par kaimiņvalstīm vai lielvaru, kā tas ir pārorientācijā. Pieskaita tikai kārts operācijas punktus.</li>
   <li>Pretinieka ietekme mērķa valstī <b>neietekmē</b>, vai apvērsums izdodas. Slieksnis vienmēr ir divkāršā stabilitāte. Pretinieka ietekme nosaka tikai to, cik noņem un cik pieliek savu.</li>
   <li>Vienāds rezultāts nav uzvara. Rezultātam jābūt <b>lielākam</b> par divkāršo stabilitāti.</li>
   <li>Savu ietekmi pieliek tikai tad, ja starpība ir lielāka par pretinieka ietekmi valstī.</li>
   <li>Stabilitātes skaitli redzi kartē, valsts lodziņa labajā augšējā stūrī.</li></ul>`,
   src: 'RB 6.0 (10. lpp.), 6.3.1–6.3.3 un piemērs (12. lpp.), 8.2.3 (15. lpp.), BB 4.–5., 12. lpp.',
   real: [IMG('rb_coup_mexico.jpg','Noteikumu grāmatas piemērs: apvērsums Meksikā (4 + 3 − 4)','RB 12. lpp.'), IMG('bb_coup_iran.jpg','Oficiālais piemērs: PSRS apvērsums Irānā','BB 4. lpp.')],
   extra: [`<p><b>Oficiālā piemēra 1. gājiens (BB 4. lpp.).</b> PSRS izspēlē kārti ar 3 operācijas punktiem apvērsumam <b>Irānā</b> (stabilitāte 2). Irānā ir ASV 1, PSRS nav nekā. Metiens 4: 4 + 3 − 4 = <b>3</b>. PSRS noņem 1 ASV marķieri un pieliek 2 savus. Irānā tagad ir ASV 0, PSRS 2. PSRS militārās operācijas: 3.</p>`,
           `<p><b>Oficiālā piemēra 1. gājiens (BB 5. lpp.).</b> ASV izspēlē kārti, kurai tajā brīdī ir 2 operācijas punkti, apvērsumam <b>Pakistānā</b> (stabilitāte 2). Pakistānā ir PSRS 1. Metiens 4: 4 + 2 − 4 = <b>2</b>. ASV noņem 1 PSRS marķieri un pieliek 1 savu. Pakistānā tagad ir ASV 1, PSRS 0.</p>`,
           `<p><b>Neizdevies apvērsums (BB 5. lpp.).</b> ASV izspēlē kārti ar 3 operācijas punktiem apvērsumam Irānā (stabilitāte 2). Metiens 1: 1 + 3 − 4 = <b>0</b>. Rezultāts nav lielāks par 4, tāpēc ietekme nemainās. ASV militāro operāciju marķieris tomēr pārvietojas par 3.</p>`] },

 { id: '8.2', title: 'Battleground valstis un DEFCON', sim: 'coupdefcon',
   rule: `<p><b>Apvērsums Battleground valstī</b> samazina DEFCON par 1 (uz kodolkara pusi). Tas notiek <b>vienmēr</b>: arī tad, ja apvērsums neizdodas.</p>
   <p>Apvērsums valstī, kas <b>nav</b> Battleground, DEFCON nemaina.</p>
   <p><b>DEFCON ierobežojumi</b> apvērsumiem ir tie paši, kas pārorientācijai. Tie ir uzdrukāti zem DEFCON trases:</p>
   <ul><li><b>DEFCON 5</b>: nav ierobežojumu.</li>
   <li><b>DEFCON 4</b>: apvērsumi nav atļauti <b>Eiropā</b>.</li>
   <li><b>DEFCON 3</b>: nav atļauti Eiropā un <b>Āzijā</b>.</li>
   <li><b>DEFCON 2</b>: nav atļauti Eiropā, Āzijā un <b>Tuvajos Austrumos</b>.</li></ul>
   <p>Ja DEFCON nokrīt līdz <b>1</b>, spēle beidzas. Zaudē aktīvais spēlētājs ${E('Phasing Player')}: tas, kura Action kārta notiek.</p>`,
   example: `<p><b>Oficiālais piemērs (BB 4. lpp.).</b> DEFCON ir 5. PSRS veic apvērsumu <b>Irānā</b>. Irāna ir Battleground valsts, tāpēc DEFCON nokrīt no 5 uz <b>4</b>.</p>
   <p>Vēlāk tajā pašā gājienā (BB 5. lpp.) ASV veic apvērsumu Irānā, kad DEFCON ir 3. Apvērsums neizdodas (rezultāts 0), bet DEFCON tik un tā nokrīt no 3 uz <b>2</b>.</p>`,
   important: `<ul><li>Battleground valsti kartē atpazīsti pēc <b>violetas nosaukuma joslas</b> un <b>sarkana</b> stabilitātes lodziņa. Jautājumos to vienmēr pateiksim.</li>
   <li>DEFCON nokrīt arī pēc <b>neizdevušā</b> apvērsuma mēģinājuma Battleground valstī.</li>
   <li>Reģionu redzi kartē. DEFCON aizliegumus redzi uz DEFCON trases. Tie nav jāmācās no galvas.</li>
   <li>Ja DEFCON ir 2 un tu veic apvērsumu Battleground valstī, kur tas ir atļauts (piemēram, Āfrikā vai Amerikā), DEFCON kļūst 1, un tu zaudē.</li></ul>`,
   src: 'RB 6.3.4 (12. lpp.), 8.1.4, 8.1.5 (14. lpp.), DEFCON trase uz kartes, BB 4.–5. lpp.',
   real: [IMG('bb_coup_iran.jpg','Oficiālais piemērs: apvērsums Irānā, DEFCON 5 → 4','BB 4. lpp.'), IMG('bb_testban.jpg','Oficiālais piemērs: neizdevies apvērsums Irānā, DEFCON 3 → 2','BB 5. lpp.'), IMG(DEF_IMG,'DEFCON trase: "No coup or realignment attempts"','Pārzīmēts pēc kartes (RB 6.–7. lpp.)')],
   extra: [`<p><b>Oficiālais piemērs (BB 5. lpp.).</b> DEFCON ir 4. ASV veic apvērsumu <b>Pakistānā</b>. Pakistāna ir Āzijā, un DEFCON 4 aizliedz tikai Eiropā, tāpēc tas ir atļauts. Pakistāna ir Battleground valsts: DEFCON nokrīt no 4 uz <b>3</b>.</p>`,
           `<p><b>Vēl viens piemērs.</b> DEFCON ir 3. PSRS grib veikt apvērsumu <b>Sudānā</b> (Āfrika, nav Battleground). DEFCON 3 Āfriku neaizliedz, tāpēc drīkst. Sudāna nav Battleground valsts, tāpēc DEFCON paliek <b>3</b>.</p>`] },

 { id: '8.3', title: 'Bezmaksas apvērsumi', sim: 'freecoup',
   rule: `<p>Dažu kāršu notikumi dod <b>bezmaksas apvērsumu</b> ${E('free Coup attempt')} noteiktā reģionā. Tas nav apvērsums ar operācijas punktiem, ko izvēlies pats. To dod kārts notikums.</p>
   <ul><li>Bezmaksas apvērsums drīkst <b>neievērot DEFCON reģionu aizliegumus</b>.</li>
   <li>Ja bezmaksas apvērsums ir <b>Battleground</b> valstī, DEFCON tomēr nokrīt par 1.</li>
   <li>Bezmaksas apvērsums <b>neskaitās militārā operācija</b>. Militāro operāciju marķieri nepārvieto.</li></ul>
   <p><b>Salīdzinājums:</b></p>
   <div class="tblw"><table class="cmp"><tr><th></th><th>Apvērsums ar operācijas punktiem</th><th>Bezmaksas apvērsums no notikuma</th></tr>
   <tr><td>DEFCON reģionu aizliegumi</td><td>jāievēro</td><td>drīkst neievērot</td></tr>

 { id: '9.2', title: 'VP un īpašās spējas', sim: 'spacerace',

 { id: '9.3', title: 'Trases beigas', sim: 'spaceend',
